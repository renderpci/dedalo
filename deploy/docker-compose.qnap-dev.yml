# Dédalo v7 — DEV overlay for the QNAP test instance (TVS-h1688X, QuTS hero).
#
# WHAT IT IS: docker-compose.simple.yml turned into a DEVELOPMENT box, where the
# deploy step is `git pull` and nothing else. It changes exactly five things:
#
#   0. it builds the Dockerfile's `dev` target — the production image with the
#      devDependencies put back, so the browser test harness (mocha, chai) and
#      the LESS compiler exist here;
#   1. the engine runs from a BIND-MOUNTED checkout, not from the image layer,
#      so pulled code is live code (the image's `COPY . .` is shadowed);
#   2. the command becomes `bun run dev:server` — `bun --watch` plus the exit-75
#      restart supervisor, so a pulled file reloads the engine in about a second;
#   3. the proxy publishes 8100 instead of 80/443, because QuTS hero already owns
#      80, 443 and 8080 for its own admin UI;
#   4. dev-facing config: verbose API errors, non-Secure session cookie (there is
#      no TLS here — a browser silently discards a Secure cookie over http:// and
#      every login would appear to succeed and then do nothing).
#
# ALWAYS USED AS AN OVERLAY, never alone, and with the SIMPLE file FIRST (that
# is what sets the project directory that `./` below resolves against):
#
#   docker compose -f docker-compose.simple.yml -f deploy/docker-compose.qnap-dev.yml <cmd>
#
# NOT FOR REAL RECORDS: it inherits the simple stack's two removals — no TLS and
# no media access control — and then adds a bind-mounted working tree on top.
# LAN test instance only. docs/install/docker.md is the stack that hardens both.

name: dedalo

services:
  dedalo:
    # Build the Dockerfile's `dev` target: the production image plus the
    # devDependencies. mocha and chai are registered client libs (devOnly), so
    # without them /dedalo/test/client/ 404s every harness script as a JSON
    # error envelope. `context` must be repeated — a `build` key with only
    # `target` is not a valid override of the simple stack's `build: .`.
    build:
      context: .
      target: dev
    environment:
      # The dev switches. Everything else is inherited from the simple stack.
      DEDALO_DEV_MODE: "true"
      DEDALO_DEBUG_API_ERRORS: "true"
      # No TLS on this box, so the cookie must not be Secure. See note 4 above.
      SESSION_COOKIE_SECURE: "false"
    volumes:
      # THE WHOLE POINT. The checkout on the NAS share is mounted over the
      # application directory, so `git pull` replaces the code the running
      # process watches. Read-write, not `:ro`, so the engine can still write
      # the artefacts it expects to own inside the tree; if a write ever fails
      # with EACCES, the fix is on the HOST, once:
      #     chown -R 1000:1000 /share/Container/dedalo/master_dedalo
      # (the image runs as `bun`, uid 1000).
      - ./:/opt/dedalo/master_dedalo
      # ...EXCEPT node_modules. An anonymous volume here keeps the tree that
      # `bun install` built INSIDE the image: the host clone has no node_modules
      # at all, and the bind mount above would otherwise hide the image's and
      # every import would fail at boot.
      #
      # THE TRAP: a dependency change needs a rebuild AND -V. Compose REATTACHES
      # the previous container's anonymous volumes when it recreates one, so
      # `build` + `up -d` quietly keeps running the OLD node_modules and the
      # freshly installed tree in the new image is never seen — the exact
      # stale-dependency failure this dev target exists to cure. Say so:
      #     docker compose -f docker-compose.simple.yml \
      #                    -f deploy/docker-compose.qnap-dev.yml \
      #                    up -d --force-recreate -V dedalo
      # (`-V` = --renew-anon-volumes. `down` on the service drops it too.)
      # A source-only pull needs none of this: the bind mount is live.
      - /opt/dedalo/master_dedalo/node_modules
    # `bun --watch` + the exit-75 supervisor (package.json). NOT `bun run dev`:
    # that also starts the LESS watcher, and CSS is a COMMITTED artefact — build
    # it where you EDIT it (`bun run css:build`) and commit the result; the pull
    # then carries it like any other file. (`less` does exist in the dev target,
    # so a one-off `docker compose exec dedalo bun run css:build` works — it just
    # is not what the long-running command should be doing.)
    command: ["bun", "run", "dev:server"]

  nginx:
    ports:
      # !override, not an addition: Compose MERGES `ports` by appending, so
      # without it the inherited 80:80 and 443:443 stay and the stack fails to
      # bind against QuTS hero's own web server. Verify with
      #   docker compose -f … -f … config | grep -A5 ports
      # before the first `up` — if this tag is unsupported by Container
      # Station's Compose, that command shows 80/443 still present.
      !override
      - "8100:80"

  # --- git, in a container ---------------------------------------------------
  # QuTS hero ships no git, and nothing needs to be installed on the NAS for it:
  # the ENGINE IMAGE already carries git (the Dockerfile installs it for the
  # code-update subsystem). This service is that image with the entrypoint set to
  # git and the working directory on the bind-mounted checkout, so:
  #
  #     docker compose -f docker-compose.simple.yml \
  #                    -f deploy/docker-compose.qnap-dev.yml run --rm git pull
  #
  # is the whole update step. `profiles` keeps it out of `up -d` (it is a
  # one-shot command, not a service); `compose run` activates the profile itself.
  #
  # THE CLONE ITSELF cannot use this service — the image is built FROM the
  # checkout, so the tree must exist first. Do that once with a throwaway
  # container that needs no build:
  #     docker run --rm -v /share/Container/dedalo:/w -w /w \
  #       alpine/git clone <remote> master_dedalo
  git:
    build:
      context: .
      target: dev
    profiles: ["tools"]
    entrypoint: ["git"]
    working_dir: /opt/dedalo/master_dedalo
    environment:
      # git REFUSES a tree owned by another uid ("dubious ownership") and would
      # otherwise need state written into a home directory that does not survive
      # `--rm`. GIT_CONFIG_COUNT injects the exemption as environment instead, so
      # this service is stateless. The host tree must still be WRITABLE by uid
      # 1000 (the image's `bun` user) — git writes .git/, not just reads it:
      #     chown -R 1000:1000 /share/Container/dedalo/master_dedalo
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /opt/dedalo/master_dedalo
      # The remote is SSH-only, so the key travels as a mount (below) and ssh is
      # told to use THAT key and nothing else. `accept-new` trusts the host key
      # on first contact and pins it for the rest of the container's life —
      # which is one command, so the known_hosts file is deliberately throwaway
      # in /tmp. Full StrictHostKeyChecking would need a known_hosts baked in;
      # `no` would disable the check entirely. `accept-new` is the middle.
      GIT_SSH_COMMAND: >-
        ssh -i /ssh/id -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts
    volumes:
      - ./:/opt/dedalo/master_dedalo
      # The deploy key, read-only. DEDALO_GIT_SSH_KEY must point at the PRIVATE
      # key file on the NAS; if it points at nothing, Docker creates an empty
      # DIRECTORY there and git fails with a confusing permission error rather
      # than a missing-file one — check the path first if a pull cannot
      # authenticate. The file must be mode 600 and readable by uid 1000.
      - ${DEDALO_GIT_SSH_KEY:-/share/Container/dedalo/deploy_key}:/ssh/id:ro
