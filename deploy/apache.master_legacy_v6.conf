# Dédalo v7 — the OFFICIAL MASTER's legacy overlay (Apache).
#
# Include this INSIDE the `master.dedalo.dev` <VirtualHost *:443> of
# deploy/apache.conf, immediately after its `ProxyTimeout` line:
#
#     Include /opt/dedalo/master_dedalo/deploy/apache.master_legacy_v6.conf
#
# Beyond what deploy/apache.conf already needs, this file requires mod_rewrite
# and mod_proxy_http. Full set (`httpd -M`): ssl_module proxy_module
# proxy_http_module rewrite_module headers_module alias_module.
#
# It is an OVERLAY, never a copy: deploy/apache.conf keeps the single
# definition of every v7 route, and this file adds only what the official
# master needs in order to keep serving PRE-7 installations. Nothing here is
# useful on an ordinary install — do not include it on one.
#
# WHAT IT IS FOR (engineering/MASTER_SERVER.md is the canon)
# The v7 engine took over master.dedalo.dev; the PHP 6.9.6 engine moved to
# v6.master.dedalo.dev. Every pre-7 installation in the world still calls the
# HISTORICAL urls on master.dedalo.dev, and must keep updating its ontology and
# its code without being touched. Their dialect is one the v7 engine refuses BY
# LAW (a form-encoded `rqo=` body, a top-level `result` key — ERRORS_SPEC §3.0),
# so those requests are handed to the PHP engine here, at the proxy, and the v7
# engine never learns a second dialect.
#
# HOW A LEGACY REQUEST IS RECOGNISED
# Only by what a pre-7 install ALREADY sends: the path, the Content-Type, and
# the Origin. Apache 2.4 cannot route on a request body (there is no
# %{REQUEST_BODY}; mod_security's phase 2 runs after URI translation, so it can
# block but not choose an upstream) — and it does not need to. The census of
# every outbound call v6 makes to a master (engineering/MASTER_SERVER.md §3.2)
# shows every server-to-server leg is form-encoded and carries no Origin, while
# both browser legs (the ontology manifest and the code manifest) are JSON and
# always carry one. v7 consumers use /api/v1/json and so never match here.
#
# ORDER: mod_rewrite's translate-name hook runs BEFORE mod_proxy's, so these
# rules pre-empt the `ProxyPass /dedalo/core/api/` and
# `ProxyPass /dedalo/install/import/ontology/` of deploy/apache.conf wherever in
# the vhost this file is included. Confirm once per box with
# `LogLevel rewrite:trace3 proxy:info`.

# --- Why the hop is https:// to the NAME, not http:// to a port -------------
# v6 defines its own identity from the request it is answering:
#   define('DEDALO_HOST', $_SERVER['HTTP_HOST'] ?? 'localhost')   config.php:31
#   DEDALO_PROTOCOL from $_SERVER['HTTPS'] === 'on'               config.php:35
# and mints every manifest file url from that pair (ontology
# class.ontology_data_io.php:638, code class.update_code.php:1195). Reached over
# a plain-HTTP loopback port, v6 would advertise
# `http://127.0.0.1:8081/dedalo/...` to the whole world and every pre-7 download
# would fail. So the hop goes to the v6 vhost by NAME, over TLS, and v6
# advertises `https://v6.master.dedalo.dev/...` — which its own vhost serves
# directly. One owner per url family. (This is also why the box needs to resolve
# v6.master.dedalo.dev itself: public-IP hairpin, or an /etc/hosts line. SNI and
# Host come from the url, not from the address.)
SSLProxyEngine On
# Verify the v6 vhost's certificate on the hop. Apache's default is
# SSLProxyVerify none — acceptable-looking here (same box, a name that resolves
# locally) but it is the difference between "trusts the name" and "trusts
# whatever answers the name", and the CA is already on disk for the vhost's own
# certificate. RHEL family path below; on Debian/Ubuntu use
# /etc/ssl/certs/ca-certificates.crt. A wrong path fails `apachectl configtest`
# loudly, which is the desired failure mode.
SSLProxyVerify require
SSLProxyCheckPeerName on
SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt

# ProxyPreserveHost must be OFF here, overriding the `On` of deploy/apache.conf:
#   - with On, the hop would carry Host/SNI `master.dedalo.dev` and LOOP back
#     into this vhost;
#   - v6 needs to see its own name to mint correct urls (above).
# It costs the v7 engine nothing: it reads no Host / X-Forwarded-Host header
# anywhere (asserted by master_legacy_routing_tripwire).
ProxyPreserveHost Off

# ===== BEGIN LEGACY-V6 DIVERSION (gate: master_legacy_routing_tripwire) =====
RewriteEngine On

# 1. The legacy structure server (pre-6.5 STRUCTURE_SERVER_URL, and the backup
#    widget's connection probe). Path-unique; the v7 engine has no such route,
#    so unrouted it would 404 against the client Alias.
RewriteRule ^/dedalo/core/extras/str_manager/(.*)$ https://v6.master.dedalo.dev/dedalo/core/extras/str_manager/$1 [P,L]

# 2. Pre-7 ontology snapshots. In steady state a v6 consumer is handed
#    v6.master.dedalo.dev urls by the manifest and never arrives here; this rule
#    is for urls minted BEFORE the rename and for anything that cached one.
RewriteRule ^/dedalo/install/import/ontology/([0-6]\.[0-9]+/.*)$ https://v6.master.dedalo.dev/dedalo/install/import/ontology/$1 [P,L]

# 3. The v6 SERVER-TO-SERVER legs on the historical API path: the ontology and
#    code readiness probes post `rqo=<json>` and the backup probe posts
#    `data=<json>`, all form-encoded (curl's default for a string body, v6
#    shared/core_functions.php curl_request). The v7 API is JSON-only
#    (src/server.ts), so it would answer these with a parse refusal.
# `%{HTTP:Content-Type}`, NOT `%{CONTENT_TYPE}`: the latter is a CGI variable
# that exists only in subprocess_env at handler time, so at translate-name time
# mod_rewrite resolves it to the EMPTY STRING and this rule silently never fires
# — every pre-7 probe would land on the v7 engine and every pre-7 panel would
# report the master as not ready. (It is `$content_type` that exists in nginx;
# this file was first drafted from an nginx design and inherited the spelling.
# Verified on httpd 2.4.68: the bare form never matches, the `HTTP:` form does.)
# Gate: master_legacy_routing_tripwire REFUSES the bare spelling by name.
RewriteCond %{HTTP:Content-Type} ^application/x-www-form-urlencoded [NC]
RewriteRule ^/dedalo/core/api/v1/json/?$ https://v6.master.dedalo.dev/dedalo/core/api/v1/json/ [P,L]

# 4. The v6 BROWSER legs on the historical API path — the ontology manifest and
#    the code manifest — plus their CORS preflight. Both post JSON, so the
#    Content-Type cannot separate them from a v7 call; their ORIGIN can. Any
#    request on this path from ANOTHER origin is a pre-7 installation's panel:
#    the master's own client is same-origin (a browser sends Origin on a
#    same-origin POST too, equal to the host), and v7 consumers use
#    /api/v1/json. No method condition, so the OPTIONS preflight is covered —
#    v6 answers its own (core/api/v1/json/index.php:38-45).
RewriteCond %{HTTP:Origin} !^$
RewriteCond %{HTTP:Origin} !^https://master\.dedalo\.dev$ [NC]
RewriteRule ^/dedalo/core/api/v1/json/?$ https://v6.master.dedalo.dev/dedalo/core/api/v1/json/ [P,L]

# 5. The v6 code archives. v6's DEDALO_CODE_FILES_URL is DEDALO_ROOT_WEB.'/code'
#    (…/dedalo/code/6/6.9/6.9.6_dedalo.zip, …/dedalo/code/development/
#    dedalo_development.zip, and the hard-coded …/dedalo/code/dedalo6_code.zip
#    of v6 core/base/update/updates.php:1444). Note the v6 downloader POSTs to
#    the zip url. Unrouted, this prefix falls into the v7 client Alias and 404s.
#    The v7 engine's own release archives live at /dedalo/install/code/ — a
#    different prefix, asserted by the gate so the two can never converge.
RewriteRule ^/dedalo/code/(.*)$ https://v6.master.dedalo.dev/dedalo/code/$1 [P,L]
# ===== END LEGACY-V6 DIVERSION =====
