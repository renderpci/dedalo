##
## How to use:
##
## Install Python (brew or similar..)
## Install mkdocs (binary_path/pip install mkdocs)
##  https://www.mkdocs.org/getting-started/#installation
## Install Material for MkDocs
##  https://squidfunk.github.io/mkdocs-material/getting-started/
## terminal run: cd current directory
## terminal run: mkdocs build -v
##
##
site_name: Dédalo Documentation

## THIS MANUAL IS FROZEN. v6 is superseded by v7; this tree is kept so existing v6
## installations keep their documentation, and it gains no new pages.
##
## It publishes to its OWN permanent prefix, dedalo.dev/docs/v6/, beside the v7
## manual at /docs/v7/. Corrections are rare; when one is needed:
##
##   mkdocs build
##   rsync -az --delete docs_site/ <user>@<host>:<docs root>/v6/
##
## site_dir used to be a SYMLINK into the website checkout's docs/ folder, so a
## build deployed itself as a side effect. That directory is now shared with the
## v7 manual, and the two builds would overwrite each other — hence a plain local
## directory plus an explicit upload.
site_dir: docs_site_v6

## Load-bearing: sets the canonical URLs and sitemap, and is where Material
## derives the version switcher's index from (its parent, /docs/versions.json).
site_url: https://dedalo.dev/docs/v6/
theme:
  name: material
  custom_dir: docs/assets/overrides
  logo: assets/images/dedalo_logo_white.svg
  favicon: assets/favicon.ico
  font: false

  features:
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.code.copy

  palette:
    ## SLATE BLUE-GREY, deliberately NOT the Dédalo orange that v7 wears.
    ## The two manuals live side by side (dedalo.dev/docs/v6/ and /docs/v7/) and
    ## share a layout, a logo and a table of contents, so colour is the fastest
    ## signal a reader has that they are on the OLDER one — faster than reading
    ## the version chip, and visible in a browser tab or a screenshot. Muted on
    ## purpose: this manual is archived, not the one to start from.
    ## The matching custom properties are in docs/additional_docs.css, keyed on
    ## [data-md-color-primary=blue-grey] — change one and you must change both.
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - footnotes
  - markdown.extensions.codehilite:
      guess_lang: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
        - name: shell
          lang: shell
          options:
            startinline: true

extra:
  generator: false

  ## The version dropdown, and the "you are reading an older version" banner that
  ## Material paints on any version not aliased `latest` — which is this one, by
  ## design. `provider: mike` names the JSON contract, not the tool: versions.json
  ## is hand-written and uploaded beside the version trees.
  version:
    provider: mike
    alias: true
    default: latest

# force to pack external libs like mermaid into a local js files (directory /assets/external)
plugins:
  - search
  - privacy:
  #- glightbox

# repo_url: https://github.com/renderpci/dedalo

copyright: DÉDALO. MANAGING CULTURAL HERITAGE ARCHIVES - <a href="https://dedalo.dev">dedalo.dev</a>

extra_css:
  - additional_docs.css

extra_javascript:
  - additional_javascript.js
