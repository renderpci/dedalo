# Dédalo v7 — reference compose stack.
#
# Operator guide: docs/install/docker.md
#
#   1. export POSTGRES_PASSWORD=… POSTGRES_DB=dedalo_main POSTGRES_USER=dedalo_user
#      (or keep them in a file and pass `docker compose --env-file <file> …`;
#       do NOT create a `.env` at the repo root — the engine's own configuration
#       loader would pick it up too)
#   2. docker compose build
#   3. docker compose up -d postgres
#   4. docker compose run --rm \
#        -e DEDALO_INSTALL_ROOT_PASSWORD='…' dedalo \
#        bun run scripts/install.ts \
#          --db-name "$POSTGRES_DB" --db-user "$POSTGRES_USER" \
#          --db-password "$POSTGRES_PASSWORD" --db-host postgres \
#          --entity mib --langs lg-spa,lg-eng
#   5. docker compose up -d
#
# Optional subsystems are behind profiles:
#   docker compose --profile diffusion up -d      # MariaDB publication target
#   docker compose --profile rag up -d            # pgvector store

name: dedalo

services:
  # --- PostgreSQL: the system of record --------------------------------------
  # POSTGRES_DB/USER/PASSWORD create an EMPTY database owned by the role — which
  # is exactly the installer's precondition (it restores INTO a database, refuses
  # a non-empty one, and never creates one itself). The role owns the database,
  # so it may CREATE EXTENSION, which the seed needs.
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dedalo_main}
      POSTGRES_USER: ${POSTGRES_USER:-dedalo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. From 18 the official
      # image stores data in a major-version subdirectory (PGDATA is
      # /var/lib/postgresql/18/docker) so that pg_upgrade --link works across a
      # single mount point. A volume on the old .../data path is detected as an
      # "unused mount/volume" and the container REFUSES TO START.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dedalo_user} -d ${POSTGRES_DB:-dedalo_main}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published. Nothing outside this network needs it.

  # --- The engine ------------------------------------------------------------
  dedalo:
    build: .
    # The container equivalent of systemd's Restart=always — and what makes the
    # browser wizard's "Save config" step work at all: the process exits after
    # writing .env so that it can be restarted into the real configuration.
    restart: unless-stopped
    # THE SUPERVISOR MUST OUTLAST THE DRAIN (P2-33 / OPS-10).
    #
    # SERVER_SHUTDOWN_GRACE_MS defaults to 10000, and the config catalog states
    # the relation as a RULE: "Keep it below the stop timeout of whatever
    # supervises the process, or the supervisor will kill the server before the
    # drain has finished — which defeats the purpose."
    #
    # Docker's default stop_grace_period is 10s. EXACTLY EQUAL is not below: a
    # restart that genuinely needs the drain is SIGKILLed at the boundary,
    # before interruptLive() and closeDatabasePool() run — so a curator
    # mid-save is cut off by a routine `compose up -d`, which is the one thing
    # the drain exists to prevent.
    #
    # 30s leaves a 20s margin over the default drain. An operator who RAISES
    # SERVER_SHUTDOWN_GRACE_MS must raise this too; the rule is the catalog's,
    # and this line is the shipped stack keeping it.
    stop_grace_period: 30s
    # LOG ROTATION (P2-33 / OPS-12). Both stacks set DEDALO_ACCESS_LOG=true, and
    # Docker's default json-file driver has NO SIZE LIMIT: an access-logged
    # install fills the host disk with container logs and takes the database
    # down with it — on the same volume, since json-file writes under
    # /var/lib/docker. A heritage install that stops serving because its own
    # request log ate the disk is the avoidable kind of outage.
    #
    # 3 x 10 MB keeps roughly the last week of a small institution's traffic and
    # is bounded whatever happens. An operator wanting more should raise
    # max-file, not remove the cap.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Process env wins over /private/.env, so these are the ops overrides.
      DEDALO_PRIVATE_DIR: /private
      SERVER_UNIX_SOCKET: /run/dedalo/dedalo_ts.sock
      MEDIA_PATH: /srv/dedalo/media
      # Turn the media gate on. With no mode set, the engine writes no rule files
      # and the proxy (which `include`s them) cannot start.
      DEDALO_MEDIA_ACCESS_MODE: ${DEDALO_MEDIA_ACCESS_MODE:-publication}
      DEDALO_ACCESS_LOG: "true"
      DB_POOL_MAX: "10"
      DB_POOL_ACQUIRE_TIMEOUT_MS: "30000"
      DB_STATEMENT_TIMEOUT_MS: "60000"
      TRUSTED_PROXY_HOPS: "1"
      # WHO MAY REACH THE INSTALL WIZARD. Until the wizard SEALS the instance its
      # actions are pre-auth — they write /private/.env and restart the engine — so
      # since 2026-08-24 an unset value means LOOPBACK ONLY. In a container that is
      # exactly nobody: nginx forwards your browser's real address (TRUSTED_PROXY_HOPS
      # above), which is never the loopback of this network namespace. So a browser
      # install through this stack REQUIRES naming the address you browse from:
      #   export DEDALO_INSTALL_ALLOWED_IPS=203.0.113.10       # or 10.0.0.0/24, or `any`
      # Leave it empty (the default here) when you install with the CLI recipe at the
      # top of this file, which needs no wizard at all. Drop the value once sealed.
      DEDALO_INSTALL_ALLOWED_IPS: ${DEDALO_INSTALL_ALLOWED_IPS:-}
      # WHERE THE BACKUPS ARE. The `backup` service below writes its dumps into the
      # `backups` volume at /backups/db, but the engine's default is
      # <privateDir>/backups/db — a DIFFERENT directory, and an empty one. Without
      # this the stack takes real nightly backups while the maintenance panel
      # reports none, and `backupRequire` then REFUSES a code update on the
      # strength of that. The two halves must name the same path.
      DEDALO_BACKUP_DIR: /backups/db
      DEDALO_DEV_MODE: "false"
      DEDALO_DEBUG_API_ERRORS: "false"
      MEDIA_DEV_ROUTE_ENABLED: "false"
      # SERVER_TCP_PORT is deliberately UNSET: production is socket-only, and the
      # proxy reaches the engine over the shared socket volume. If you set it for
      # debugging, do NOT add a `ports:` mapping for it.
    volumes:
      - private:/private          # .env, sessions, ts_state.json — SECRETS
      - media:/srv/dedalo/media   # written by the engine, READ by the proxy
      - socket:/run/dedalo        # the unix socket, shared with the proxy
      # READ so the panel and the code-updater's precondition can SEE the nightly
      # dumps; WRITE because the make_backup widget creates them from the panel
      # too, into the same directory. Same volume the `backup` service writes.
      - backups:/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--unix-socket", "/run/dedalo/dedalo_ts.sock", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- The reverse proxy -----------------------------------------------------
  # Owns TCP + TLS, serves the client statics, and ENFORCES media access control
  # by including the two rule files the engine generates into the media volume.
  # It therefore MUST share the media volume with the engine, and it will fail to
  # start until the engine has written those files (restart: unless-stopped makes
  # it retry).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - dedalo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/opt/dedalo/master_dedalo/client:ro
      - media:/srv/dedalo/media:ro
      - socket:/run/dedalo
      # TLS. For a real deployment bind-mount your certbot tree here; for a local
      # trial, drop a self-signed fullchain.pem + privkey.pem in deploy/certs/.
      - ./deploy/certs:/etc/letsencrypt/live/dedalo.example.org:ro

  # --- Optional: MariaDB diffusion (publication) target ----------------------
  # The engine NEVER creates the target database — a missing one is a loud
  # configuration error. MARIADB_DATABASE creates it here.
  mariadb:
    image: mariadb:11
    profiles: ["diffusion"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DEDALO_DIFFUSION_DB_NAME:-web_dedalo}
      MARIADB_USER: ${DEDALO_DIFFUSION_DB_USER:-dedalo_pub}
      MARIADB_PASSWORD: ${DEDALO_DIFFUSION_DB_PASSWORD:-}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadata:/var/lib/mysql

  # --- Optional: pgvector store for RAG --------------------------------------
  # NOTE: creating the database is NOT enough. No code creates the RAG schema —
  # apply the DDL from docs/core/ai/rag_cookbook.md by hand, once.
  pgvector:
    image: pgvector/pgvector:pg18
    profiles: ["rag"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEDALO_RAG_DB_NAME:-dedalo_rag}
      POSTGRES_USER: ${DEDALO_RAG_DB_USERNAME_CONN:-dedalo_rag}
      POSTGRES_PASSWORD: ${DEDALO_RAG_DB_PASSWORD_CONN:-}
    volumes:
      # Same 18+ layout rule as the `postgres` service above — pgvector tracks
      # the official image, so the old .../data mount point refuses to start.
      - ragdata:/var/lib/postgresql

  # --- Nightly backup --------------------------------------------------------
  # THE STACK HAD NO BACKUP JOB AT ALL (P0-13, 2026-08-30). deploy/dedalo-backup.*
  # is a systemd unit, which a compose host does not run — so every containerised
  # install shipped with no scheduled copy of anything, while `private:` and
  # `media:` carried the comment "back this up" and nothing did.
  #
  # It runs the SAME scripts the systemd unit runs (bind-mounted: deploy/ is
  # deliberately absent from the image, see the Dockerfile's build-context
  # allowlist), so there is one implementation of "what a backup is" and not two.
  #
  # THREE OF THE FIVE STORES OF engineering/PRODUCTION.md §6 EXIST HERE: the matrix
  # DB (1), the media originals (3) and /private (4). Store 2 (RAG) lives in the
  # `rag` profile — add a fourth step for it, like the unit's commented line, if you
  # enable it; store 5 (site-builder instances) is not part of this stack.
  #
  # WHERE IT WRITES, AND WHAT THAT IS WORTH. Into the `backups` volume — i.e. onto
  # this same host, next to the data. That is a real restore point for the failures
  # that actually happen most (a bad import, a deleted record, a truncated dump) and
  # NO PROTECTION AT ALL against losing the machine or the disk. Copy the volume off
  # this host on a schedule you control; nothing in a single-host compose file can
  # do that for you, and a backup that never leaves the machine it protects is half
  # a backup.
  #
  # HOW YOU KNOW IT WORKED: `docker compose ps` marks this service UNHEALTHY while
  # /backups/BACKUP_FAILED exists — the marker the run writes when any store fails
  # and removes when every store succeeds. That file, and /backups/LAST_OK, are the
  # two things to look at.
  backup:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The database this stack created. If you told the install wizard a DIFFERENT
      # database or role than these, correct them here — the backup connects on its
      # own and cannot ask the engine what it chose.
      DB_NAME: ${POSTGRES_DB:-dedalo_main}
      DB_USER: ${POSTGRES_USER:-dedalo_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_HOST: postgres
      # Same media root the engine and the proxy use, mounted read-only below.
      MEDIA_PATH: /srv/dedalo/media
      DEDALO_BACKUP_STATE_DIR: /backups
      # How many dated generations of the media originals and of /private to keep.
      # A one-generation mirror propagates a mass deletion within a day; these are
      # hard-linked, so a fortnight of them costs about one copy plus the changes.
      DEDALO_BACKUP_KEEP: "14"
    volumes:
      - ./deploy:/opt/dedalo/master_dedalo/deploy:ro
      - private:/private:ro
      - media:/srv/dedalo/media:ro
      - backups:/backups
    # One run a day, the first one an hour after start. `sleep & wait` (not a bare
    # sleep) is the same shape as the nginx/certbot loops above: it lets SIGTERM
    # stop the container promptly instead of waiting out the sleep.
    entrypoint:
      - /bin/sh
      - -c
      - |
        # NO `set -e`: a store that fails must not stop the next one, nor kill the
        # loop. The run's verdict is /backups/BACKUP_FAILED (written by the last
        # step, removed when every store succeeded) and the healthcheck reads it.
        set -u
        D=/opt/dedalo/master_dedalo/deploy
        export DEDALO_BACKUP_STATUS_DIR=/tmp/dedalo-backup-status
        # Which stores this loop promises. Without it the aggregate can only see
        # the stores that RECORDED a status, so a step that never ran at all is
        # invisible and a partial run reports success (see dedalo-backup-step.sh).
        export DEDALO_BACKUP_EXPECTED_STORES="matrix_db media private"
        sleep 3600 & wait $${!}
        while :; do
          rm -rf "$$DEDALO_BACKUP_STATUS_DIR"
          "$$D/dedalo-backup-step.sh" run matrix_db \
            "$$D/dedalo-db-backup.sh" --label compose --dir /backups/db \
            --db-key DB_NAME --host-key DB_HOST --port-key DB_PORT \
            --user-key DB_USER --password-key DB_PASSWORD \
            --pg-dump pg_dump --pg-restore pg_restore
          "$$D/dedalo-backup-step.sh" run media \
            "$$D/dedalo-tree-backup.sh" --label media --source-key MEDIA_PATH \
            --dest /backups/media --keep "$$DEDALO_BACKUP_KEEP"
          "$$D/dedalo-backup-step.sh" run --last private \
            "$$D/dedalo-tree-backup.sh" --label private --source /private/ \
            --dest /backups/private --keep "$$DEDALO_BACKUP_KEEP"
          sleep 86400 & wait $${!}
        done
    healthcheck:
      # UNHEALTHY while the last run left a failure marker. This is the whole
      # notification mechanism a compose host gets: there is no systemd OnFailure=
      # here, so the state has to be visible in `docker compose ps`.
      test: ["CMD-SHELL", "test ! -e /backups/BACKUP_FAILED"]
      interval: 300s
      timeout: 5s
      retries: 1
      start_period: 60s

volumes:
  pgdata:
  private:      # SECRETS — back this up
  media:        # the originals are the source of truth — back this up
  socket:
  backups:      # the nightly copies — SEE THE backup SERVICE: copy this OFF this host
  mariadata:
  ragdata:
