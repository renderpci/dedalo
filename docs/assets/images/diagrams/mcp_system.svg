<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1300" width="1640" height="1300" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c9d0da"/>
</marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5f6875"/>
</marker>
</defs>
<style>
  .ttl { font-size:30px; font-weight:700; fill:#171a21; }
  .sub { font-size:14.5px; fill:#5f6875; }
  .lane { font-size:11px; font-weight:700; letter-spacing:1.6px; fill:#5f6875; }
  .bt { font-size:14.5px; font-weight:650; fill:#171a21; }
  .bs { font-size:11.8px; fill:#5f6875; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:11.5px; fill:#5f6875; }
  .edge { fill:none; stroke:#c9d0da; stroke-width:1.8; }
  .edged { fill:none; stroke:#5f6875; stroke-width:1.6; stroke-dasharray:5 4; }
  .elab { font-size:10.8px; fill:#5f6875; }
  .note { font-size:12px; fill:#5f6875; }
</style>
<rect width="1640" height="1300" fill="#ffffff"/>
<text class="ttl" x="56" y="60">Dédalo v7 — MCP and the agent loop</text>
<text class="sub" x="56" y="86">src/ai/mcp — one tool catalog, four surfaces, and a write protocol in which the model never writes</text>
<rect x="56" y="110" width="1528" height="200" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="134">SURFACES — every one of them consumes the SAME catalog</text><rect x="80" y="146" width="356" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="146" width="4" height="140" rx="2" fill="#2563eb"/><text class="bt" x="96" y="170">stdio MCP server</text><text class="bs" x="96" y="190">src/ai/mcp/server.ts — a thin transport</text><text class="bs" x="96" y="206">shell with no business logic and no</text><text class="bs" x="96" y="222">privilege. ONE service identity, fixed</text><text class="bs" x="96" y="238">at startup (DEDALO_MCP_USER_ID); no tool</text><text class="bs" x="96" y="254">can change it, and the GRANTS are re-</text><text class="bs" x="96" y="270">asked on every call.</text><rect x="468" y="146" width="356" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="468" y="146" width="4" height="140" rx="2" fill="#2563eb"/><text class="bt" x="484" y="170">dd_mcp_api — the in-process bridge</text><text class="bs" x="484" y="190">the web client's assistant. Serves the</text><text class="bs" x="484" y="206">JSON-RPC envelope from the SAME registry,</text><text class="bs" x="484" y="222">in process: no child process, no cookie</text><text class="bs" x="484" y="238">forwarding, no wire to redact — and one</text><text class="bs" x="484" y="254">registry to reason about, not two.</text><rect x="856" y="146" width="356" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="856" y="146" width="4" height="140" rx="2" fill="#6d28d9"/><text class="bt" x="872" y="170">the agent loop</text><text class="bs" x="872" y="190">src/ai/agent/loop.ts — a manual tool-use</text><text class="bs" x="872" y="206">loop over the same registry plus RAG</text><text class="bs" x="872" y="222">semantic search. Capped iterations, the</text><text class="bs" x="872" y="238">transcript returned for audit, multi-turn</text><text class="bs" x="872" y="254">kept STATELESS (tool traffic never replayed).</text><rect x="1244" y="146" width="292" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1244" y="146" width="4" height="140" rx="2" fill="#0f766e"/><text class="bt" x="1260" y="170">Publication API MCP</text><text class="bs" x="1260" y="190">publication/server_api/v2 — a</text><text class="bs" x="1260" y="206">SEPARATE, stateless server over</text><text class="bs" x="1260" y="222">the PUBLISHED database only:</text><text class="bs" x="1260" y="238">9 read tools, a fresh server and</text><text class="bs" x="1260" y="254">transport per request.</text><rect x="56" y="340" width="1528" height="252" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="364">THE ONE REGISTRY — src/ai/mcp/registry.ts</text><rect x="80" y="376" width="430" height="180" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="376" width="4" height="180" rx="2" fill="#2563eb"/><text class="bt" x="96" y="400">TOOL_REGISTRY</text><text class="bs" x="96" y="420">discovery · records_read · search ·</text><text class="bs" x="96" y="436">media · records_write · fields_write</text><text class="bs" x="96" y="452"></text><text class="bs" x="96" y="468">One catalog means the surfaces cannot</text><text class="bs" x="96" y="484">drift — and the write-scope tripwire can</text><text class="bs" x="96" y="500">enumerate the write tools mechanically,</text><text class="bs" x="96" y="516">instead of trusting a comment.</text><rect x="550" y="376" width="440" height="180" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="550" y="376" width="4" height="180" rx="2" fill="#0f766e"/><text class="bt" x="566" y="400">READ tools</text><text class="mono" xml:space="preserve" x="566" y="420">dedalo_list_sections</text><text class="mono" xml:space="preserve" x="566" y="436">dedalo_describe_section</text><text class="mono" xml:space="preserve" x="566" y="452">dedalo_describe_node</text><text class="mono" xml:space="preserve" x="566" y="468">dedalo_read_record</text><text class="mono" xml:space="preserve" x="566" y="484">dedalo_search_records / _section</text><text class="mono" xml:space="preserve" x="566" y="500">dedalo_count_records</text><text class="mono" xml:space="preserve" x="566" y="516">dedalo_resolve · dedalo_resolve_path</text><text class="mono" xml:space="preserve" x="566" y="532">dedalo_get_media_info</text><rect x="1030" y="376" width="506" height="180" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1030" y="376" width="4" height="180" rx="2" fill="#b45309"/><text class="bt" x="1046" y="400">WRITE tools — registered only on opt-in</text><text class="mono" xml:space="preserve" x="1046" y="420">dedalo_create_record    dedalo_save_component</text><text class="mono" xml:space="preserve" x="1046" y="436">dedalo_set_field        dedalo_duplicate_record</text><text class="mono" xml:space="preserve" x="1046" y="452">dedalo_delete_record    dedalo_find_or_create</text><text class="mono" xml:space="preserve" x="1046" y="468">dedalo_portal_link      dedalo_portal_unlink</text><text class="mono" xml:space="preserve" x="1046" y="484">dedalo_upload_media</text><text class="mono" xml:space="preserve" x="1046" y="500"></text><text class="mono" xml:space="preserve" x="1046" y="516">DEDALO_MCP_ALLOW_WRITE=true, optionally narrowed</text><text class="mono" xml:space="preserve" x="1046" y="532">by DEDALO_MCP_WRITE_SECTIONS=&lt;section allowlist&gt;</text><rect x="56" y="620" width="1528" height="340" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="644">runTool — the SINGLE execution chokepoint (a tool module holds nothing but a pure handler)</text><rect x="80" y="692" width="478" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="692" width="4" height="140" rx="2" fill="#2563eb"/><text class="bt" x="96" y="716">input re-validation</text><text class="bs" x="96" y="736">the MCP SDK validates the stdio path —</text><text class="bs" x="96" y="752">but the HTTP bridge and the change-plan</text><text class="bs" x="96" y="768">apply path enter here directly, so</text><text class="bs" x="96" y="784">validation lives HERE, once, rather than</text><text class="bs" x="96" y="800">once per surface.</text><rect x="585" y="692" width="478" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="585" y="692" width="4" height="140" rx="2" fill="#be123c"/><text class="bt" x="601" y="716">ACL, unchanged</text><text class="bs" x="601" y="736">every call runs under the CALLER's</text><text class="bs" x="601" y="752">Principal: reads need level ≥ 1, writes</text><text class="bs" x="601" y="768">level ≥ 2, and every change is audited in</text><text class="bs" x="601" y="784">the Time Machine. AI is denied exactly</text><text class="bs" x="601" y="800">where the human is denied.</text><rect x="1090" y="692" width="478" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1090" y="692" width="4" height="140" rx="2" fill="#b45309"/><text class="bt" x="1106" y="716">write-section allowlist</text><text class="bs" x="1106" y="736">when DEDALO_MCP_WRITE_SECTIONS is</text><text class="bs" x="1106" y="752">configured, a write tool refuses any</text><text class="bs" x="1106" y="768">section outside it — and the error is</text><text class="bs" x="1106" y="784">translated, here, into the one structured</text><text class="bs" x="1106" y="800">envelope every surface returns.</text><rect x="80" y="852" width="1488" height="88" rx="9" fill="#f5f7fa" stroke="#c9d0da"/><rect x="80" y="852" width="4" height="88" rx="2" fill="#6d28d9"/><text class="bt" x="96" y="876">EGRESS GATE — in the agent LOOP, not in runTool</text><text class="bs" x="96" y="896">When the conversation's model is EXTERNAL, every record-content tool call is gated BEFORE its handler runs and semantic-search hits are filtered per record: restricted</text><text class="bs" x="96" y="912">repository content never enters an external model context. Local models are never gated, and the stdio server and the mcp_proxy bridge are unaffected by construction — no model is involved.</text><rect x="56" y="990" width="1528" height="252" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="1014">WRITE PROTOCOL — propose → confirm → apply.  The loop NEVER writes.</text><rect x="80" y="1062" width="272" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="1062" width="4" height="150" rx="2" fill="#2563eb"/><text class="bt" x="96" y="1086">1 · propose</text><text class="bs" x="96" y="1106">in write mode the model gets</text><text class="bs" x="96" y="1122">the READ tools plus ONE</text><text class="bs" x="96" y="1138">synthetic tool, propose_change_</text><text class="bs" x="96" y="1154">plan: an ordered list of ops,</text><text class="bs" x="96" y="1170">each exactly one write tool</text><rect x="382" y="1062" width="272" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="382" y="1062" width="4" height="150" rx="2" fill="#be123c"/><text class="bt" x="398" y="1086">2 · validate (dry run)</text><text class="bs" x="398" y="1106">tool exists and is a write tool;</text><text class="bs" x="398" y="1122">section allowlist; level ≥ 2;</text><text class="bs" x="398" y="1138">field LABELS resolved and</text><text class="bs" x="398" y="1154">STAMPED to tipos; refs point at</text><text class="bs" x="398" y="1170">earlier create-ops</text><path class="edge" d="M356,1137 L382,1137" marker-end="url(#a)"/><rect x="684" y="1062" width="272" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="684" y="1062" width="4" height="150" rx="2" fill="#b45309"/><text class="bt" x="700" y="1086">3 · hash, then confirm</text><text class="bs" x="700" y="1106">hashed over canonical JSON, so</text><text class="bs" x="700" y="1122">the human confirms the RESOLVED</text><text class="bs" x="700" y="1138">plan and anything that drifted</text><text class="bs" x="700" y="1154">fails later as plan_hash_</text><text class="bs" x="700" y="1170">mismatch</text><path class="edge" d="M658,1137 L684,1137" marker-end="url(#a)"/><rect x="986" y="1062" width="272" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="986" y="1062" width="4" height="150" rx="2" fill="#6d28d9"/><text class="bt" x="1002" y="1086">4 · apply, statelessly</text><text class="bs" x="1002" y="1106">no server-held plan state exists</text><text class="bs" x="1002" y="1122">between propose and apply: the</text><text class="bs" x="1002" y="1138">client resends the whole plan</text><text class="bs" x="1002" y="1154">and EVERY gate re-runs. That</text><text class="bs" x="1002" y="1170">re-validation is the boundary.</text><path class="edge" d="M960,1137 L986,1137" marker-end="url(#a)"/><rect x="1288" y="1062" width="272" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1288" y="1062" width="4" height="150" rx="2" fill="#15803d"/><text class="bt" x="1304" y="1086">5 · execute via runTool</text><text class="bs" x="1304" y="1106">ops run sequentially, never</text><text class="bs" x="1304" y="1122">against the engines directly;</text><text class="bs" x="1304" y="1138">each is its own transaction and</text><text class="bs" x="1304" y="1154">TM audit. Stop on first error →</text><text class="bs" x="1304" y="1170">{ applied, failed, skipped }</text><path class="edge" d="M1262,1137 L1288,1137" marker-end="url(#a)"/><path class="edge" d="M258,286 L258,320 L295,320 L295,376" marker-end="url(#a)"/><path class="edge" d="M646,286 L646,320 L295,320" marker-end="url(#a)"/><path class="edge" d="M1034,286 L1034,320 L295,320" marker-end="url(#a)"/><path class="edge" d="M295,556 L295,692" marker-end="url(#a)"/><text class="elab" x="312" y="630" text-anchor="start">every call goes through runTool</text><text class="note" x="56" y="1272">Registry src/ai/mcp/registry.ts · handlers src/ai/mcp/tools/ · loop, egress and change plan src/ai/agent/ · bridge src/core/api/handlers/dd_mcp_api.ts · spec: engineering/REWRITE_SPEC.md §8</text>
</svg>
