<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1244" width="1640" height="1244" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c9d0da"/>
</marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5f6875"/>
</marker>
</defs>
<style>
  .ttl { font-size:30px; font-weight:700; fill:#171a21; }
  .sub { font-size:14.5px; fill:#5f6875; }
  .lane { font-size:11px; font-weight:700; letter-spacing:1.6px; fill:#5f6875; }
  .bt { font-size:14.5px; font-weight:650; fill:#171a21; }
  .bs { font-size:11.8px; fill:#5f6875; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:11.5px; fill:#5f6875; }
  .edge { fill:none; stroke:#c9d0da; stroke-width:1.8; }
  .edged { fill:none; stroke:#5f6875; stroke-width:1.6; stroke-dasharray:5 4; }
  .elab { font-size:10.8px; fill:#5f6875; }
  .note { font-size:12px; fill:#5f6875; }
</style>
<rect width="1640" height="1244" fill="#ffffff"/>
<text class="ttl" x="56" y="60">Dédalo v7 — the Work API</text>
<text class="sub" x="56" y="86">/api/v1 — the engine's own API: one RQO in, one envelope out, through an explicit allowlist and five gates that cannot be skipped</text>
<rect x="56" y="118" width="320" height="122" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="56" y="118" width="4" height="122" rx="2" fill="#475569"/><text class="bt" x="72" y="142">Client</text><text class="bs" x="72" y="162">client/ — the TS-owned primary</text><text class="bs" x="72" y="178">source, vanilla JS; posts an RQO,</text><text class="bs" x="72" y="194">renders whatever the payload says</text><rect x="416" y="118" width="320" height="122" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="416" y="118" width="4" height="122" rx="2" fill="#475569"/><text class="bt" x="432" y="142">server.ts</text><text class="bs" x="432" y="162">unix socket (or port) behind the</text><text class="bs" x="432" y="178">reverse proxy: /api/v1, /health,</text><text class="bs" x="432" y="194">static assets, SSE job streams</text><rect x="776" y="118" width="380" height="122" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="776" y="118" width="4" height="122" rx="2" fill="#2563eb"/><text class="bt" x="792" y="142">RQO — the request object</text><text class="bs" x="792" y="162">{ dd_api, action, source, sqo,</text><text class="bs" x="792" y="178">  section_tipo, section_id, options }</text><text class="bs" x="792" y="194">SQO is sanitized (strip + clamp) before it</text><text class="bs" x="792" y="210">ever reaches the SQL assembler</text><rect x="1196" y="118" width="388" height="122" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1196" y="118" width="4" height="122" rx="2" fill="#6d28d9"/><text class="bt" x="1212" y="142">Request identity (AsyncLocalStorage)</text><text class="bs" x="1212" y="162">application lang · data lang · principal ·</text><text class="bs" x="1212" y="178">transaction — scoped PER REQUEST and never</text><text class="bs" x="1212" y="194">captured at module level, so one Bun process</text><text class="bs" x="1212" y="210">serves concurrent users without bleed</text><rect x="56" y="280" width="1528" height="200" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="304">dispatch.ts — GATE ORDER (every refusal is a thrown DedaloError)</text><rect x="80" y="318" width="272" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="318" width="4" height="140" rx="2" fill="#be123c"/><text class="bt" x="96" y="342">1 · Allowlist</text><text class="bs" x="96" y="362">ACTION_REGISTRY is an explicit</text><text class="bs" x="96" y="378">(class, action) map — no dynamic</text><text class="bs" x="96" y="394">method lookup, so an unregistered</text><text class="bs" x="96" y="410">action simply does not exist</text><rect x="382" y="318" width="272" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="382" y="318" width="4" height="140" rx="2" fill="#be123c"/><text class="bt" x="398" y="342">2 · Session</text><text class="bs" x="398" y="362">required unless the PAIR is in</text><text class="bs" x="398" y="378">NO_LOGIN_ACTIONS — keyed on</text><text class="bs" x="398" y="394">`class:action`, so a colliding</text><text class="bs" x="398" y="410">action name inherits nothing</text><path class="edge" d="M356,388 L382,388" marker-end="url(#a)"/><rect x="684" y="318" width="272" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="684" y="318" width="4" height="140" rx="2" fill="#be123c"/><text class="bt" x="700" y="342">3 · CSRF</text><text class="bs" x="700" y="362">constant-time compare for every</text><text class="bs" x="700" y="378">authenticated, non-exempt</text><text class="bs" x="700" y="394">action</text><path class="edge" d="M658,388 L684,388" marker-end="url(#a)"/><rect x="986" y="318" width="272" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="986" y="318" width="4" height="140" rx="2" fill="#b45309"/><text class="bt" x="1002" y="342">4 · Idempotency</text><text class="bs" x="1002" y="362">a stamped request executes</text><text class="bs" x="1002" y="378">ONCE; its twins replay the</text><text class="bs" x="1002" y="394">answer it produced</text><path class="edge" d="M960,388 L986,388" marker-end="url(#a)"/><rect x="1288" y="318" width="272" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1288" y="318" width="4" height="140" rx="2" fill="#2563eb"/><text class="bt" x="1304" y="342">5 · RequestContext</text><text class="bs" x="1304" y="362">the handler runs with an</text><text class="bs" x="1304" y="378">EXPLICIT context object —</text><text class="bs" x="1304" y="394">no globals, no ambient session</text><path class="edge" d="M1262,388 L1288,388" marker-end="url(#a)"/><rect x="56" y="510" width="1528" height="180" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="534">HANDLER CLASSES — api/handlers/&lt;class&gt;.ts (dispatch.ts is registry + gates + envelope only)</text><rect x="80" y="546" width="352" height="128" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="546" width="4" height="128" rx="2" fill="#2563eb"/><text class="bt" x="96" y="570">dd_core_api</text><text class="mono" xml:space="preserve" x="96" y="590">read · save · create · duplicate</text><text class="mono" xml:space="preserve" x="96" y="606">delete · count · start · read_raw</text><text class="mono" xml:space="preserve" x="96" y="622">get_element_context · get_section_terms</text><text class="mono" xml:space="preserve" x="96" y="638">get_indexation_grid · get_environment</text><rect x="456" y="546" width="352" height="128" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="456" y="546" width="4" height="128" rx="2" fill="#0f766e"/><text class="bt" x="472" y="570">components + tree</text><text class="mono" xml:space="preserve" x="472" y="590">dd_component_portal_api</text><text class="mono" xml:space="preserve" x="472" y="606">dd_component_text_area_api · _av_api</text><text class="mono" xml:space="preserve" x="472" y="622">dd_component_3d_api · dd_component_info</text><text class="mono" xml:space="preserve" x="472" y="638">dd_ts_api   (thesaurus / ontology tree)</text><rect x="832" y="546" width="352" height="128" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="832" y="546" width="4" height="128" rx="2" fill="#6d28d9"/><text class="bt" x="848" y="570">subsystem doors</text><text class="mono" xml:space="preserve" x="848" y="590">dd_diffusion_api · dd_rag_api</text><text class="mono" xml:space="preserve" x="848" y="606">dd_identify_api  · dd_external_api</text><text class="mono" xml:space="preserve" x="848" y="622">dd_mcp_api       · dd_tools_api</text><text class="mono" xml:space="preserve" x="848" y="638">dd_area_maintenance_api</text><rect x="1208" y="546" width="328" height="128" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1208" y="546" width="4" height="128" rx="2" fill="#475569"/><text class="bt" x="1224" y="570">utility</text><text class="mono" xml:space="preserve" x="1224" y="590">dd_utils_api  (login, login_context)</text><text class="mono" xml:space="preserve" x="1224" y="606">dd_error_report_api</text><text class="mono" xml:space="preserve" x="1224" y="622">menu · activity_log · system_info</text><text class="mono" xml:space="preserve" x="1224" y="638">install actions (IP-gated surface)</text><rect x="56" y="720" width="744" height="320" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="744">READ PATH</text><rect x="80" y="792" width="330" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="792" width="4" height="100" rx="2" fill="#2563eb"/><text class="bt" x="96" y="816">section/read_facade.ts</text><text class="bs" x="96" y="836">sub-action routing: relation_list,</text><text class="bs" x="96" y="852">related_search, time machine,</text><text class="bs" x="96" y="868">resolve_data, component get_data</text><rect x="440" y="792" width="336" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="440" y="792" width="4" height="100" rx="2" fill="#2563eb"/><text class="bt" x="456" y="816">section/read.ts</text><text class="bs" x="456" y="836">context + data — the pinned</text><text class="bs" x="456" y="852">build_json_rows shape the client</text><text class="bs" x="456" y="868">is contractually built against</text><rect x="80" y="916" width="330" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="916" width="4" height="100" rx="2" fill="#0f766e"/><text class="bt" x="96" y="940">relations/registry.ts</text><text class="bs" x="96" y="960">portal · autocomplete · dataframe</text><text class="bs" x="96" y="976">children · index · related, all</text><text class="bs" x="96" y="992">through one shared emit path</text><rect x="440" y="916" width="336" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="440" y="916" width="4" height="100" rx="2" fill="#0f766e"/><text class="bt" x="456" y="940">ontology/resolver.ts</text><text class="bs" x="456" y="960">the cached accessor over</text><text class="bs" x="456" y="976">dd_ontology; a virtual section</text><text class="bs" x="456" y="992">resolves to its real section</text><rect x="840" y="720" width="744" height="320" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="858" y="744">WRITE PATH</text><rect x="864" y="792" width="330" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="864" y="792" width="4" height="100" rx="2" fill="#b45309"/><text class="bt" x="880" y="816">record/save_component.ts</text><text class="bs" x="880" y="836">the single component write door —</text><text class="bs" x="880" y="852">transaction-wrapped and</text><text class="bs" x="880" y="868">time-machine audited</text><rect x="1224" y="792" width="336" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1224" y="792" width="4" height="100" rx="2" fill="#b45309"/><text class="bt" x="1240" y="816">matrix_write · json_codec</text><text class="bs" x="1240" y="836">atomic matrix DML, the ONE JSONB</text><text class="bs" x="1240" y="852">serializer, one dbTimestamp,</text><text class="bs" x="1240" y="868">the locator equality law</text><rect x="864" y="916" width="330" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="864" y="916" width="4" height="100" rx="2" fill="#6d28d9"/><text class="bt" x="880" y="940">after the commit</text><text class="bs" x="880" y="960">observer propagation · RAG</text><text class="bs" x="880" y="976">enqueue · diffusion bridge ·</text><text class="bs" x="880" y="992">activity + time-machine rows</text><rect x="1224" y="916" width="336" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1224" y="916" width="4" height="100" rx="2" fill="#475569"/><text class="bt" x="1240" y="940">Postgres (matrix)</text><text class="bs" x="1240" y="960">matrix_* tables, JSONB `datos`;</text><text class="bs" x="1240" y="976">pooled Bun.sql, transaction</text><text class="bs" x="1240" y="992">scoped by the request's ALS</text><rect x="56" y="1068" width="1528" height="130" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="1092">RESPONSE — ENVELOPE v2 (one converter, no exceptions)</text><rect x="80" y="1100" width="700" height="84" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="1100" width="4" height="84" rx="2" fill="#15803d"/><text class="bt" x="96" y="1124">Success</text><text class="bs" x="96" y="1144">a handler returns ok(data, notices) →</text><text class="bs" x="96" y="1160">{ ok: true, request_id, data, notices }</text><rect x="828" y="1100" width="708" height="84" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="828" y="1100" width="4" height="84" rx="2" fill="#be123c"/><text class="bt" x="844" y="1124">Failure</text><text class="bs" x="844" y="1144">any throw → toErrorEnvelope → { ok: false, request_id, error, notices } at the registry status;</text><text class="bs" x="844" y="1160">a handler body that is not an envelope is itself a bug, refused as internal.unexpected</text><path class="edge" d="M376,179 L416,179" marker-end="url(#a)"/><path class="edge" d="M736,179 L776,179" marker-end="url(#a)"/><path class="edge" d="M966,240 L966,262 L216,262 L216,318" marker-end="url(#a)"/><path class="edge" d="M1424,458 L1424,494 L256,494 L256,546" marker-end="url(#a)"/><path class="edge" d="M245,690 L245,792" marker-end="url(#a)"/><text class="elab" x="262" y="712" text-anchor="start">read</text><path class="edge" d="M1029,690 L1029,792" marker-end="url(#a)"/><text class="elab" x="1046" y="712" text-anchor="start">save · create · delete</text><path class="edge" d="M410,842 L440,842" marker-end="url(#a)"/><path class="edge" d="M608,892 L608,904 L245,904 L245,916" marker-end="url(#a)"/><path class="edge" d="M608,892 L608,916" marker-end="url(#a)"/><path class="edge" d="M1194,842 L1224,842" marker-end="url(#a)"/><path class="edge" d="M1029,892 L1029,916" marker-end="url(#a)"/><path class="edge" d="M1392,892 L1392,916" marker-end="url(#a)"/><path class="edge" d="M428,1040 L428,1100" marker-end="url(#a)"/><path class="edge" d="M1212,1040 L1212,1100" marker-end="url(#a)"/><text class="note" x="56" y="1216">Registry, gates and envelope live in core/api/dispatch.ts · handler bodies in core/api/handlers/ · read routing in core/section/read_facade.ts · the error registry is closed and the converter is the only place a wire error is built</text>
</svg>
