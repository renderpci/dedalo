<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs>
<style>
 .t1{font-size:40px;font-weight:750;fill:#14161b}
 .t2{font-size:20px;fill:#4f5967}
 .zl{font-size:15px;font-weight:750;letter-spacing:1.3px}
 .ct{font-size:22px;font-weight:700;fill:#14161b}
 .cs{font-size:14px;font-weight:700;letter-spacing:1.1px}
 .cb{font-size:16.5px;fill:#4f5967}
 .num{font-size:25px;font-weight:750;fill:#ffffff}
 .fact{font-size:17px;fill:#4f5967}
 .factt{font-size:18px;font-weight:700;fill:#14161b}
 .lbl{font-size:14.5px;fill:#4f5967}
 .quote{font-size:17px;fill:#14161b;font-style:italic}
 .edge{fill:none;stroke:#9aa4b2;stroke-width:2.2}
 .foot{font-size:15px;fill:#7b8593}
</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="t1" x="56" y="70">Three doors into the same collection</text>
<text class="t2" x="56" y="104">An “API” is simply a door other programs may knock on. Dédalo has three, and each one is guarded differently.</text>
<rect x="56" y="156" width="456" height="520" rx="18" fill="#ffffff" stroke="#d3e0fc" stroke-width="2"/><rect x="56" y="156" width="456" height="96" rx="18" fill="#eff4ff"/><rect x="56" y="234" width="456" height="18" fill="#eff4ff"/><g transform="translate(-0.00,1.39) translate(110,206) scale(1.26) translate(-110,-206)"><circle cx="110.0" cy="196.76" r="6.6" fill="#2563eb"/><path d="M96.36,219.64 C96.36,204.68 123.64,204.68 123.64,219.64 Z" fill="#2563eb"/></g><text class="ct" x="152" y="202">The staff door</text><text class="lbl" x="152" y="226">What people call: the Work API</text><text class="cs" x="84" y="296" fill="#2563eb">WHO GOES THROUGH IT</text><text class="cb" x="84" y="322">Your own team, signed in with a</text><text class="cb" x="84" y="346">personal account.</text><text class="cs" x="84" y="404" fill="#2563eb">WHAT THEY CAN DO</text><text class="cb" x="84" y="430">Everything their permissions allow:</text><text class="cb" x="84" y="454">create, edit, relate, publish, delete —</text><text class="cb" x="84" y="478">field by field, section by section.</text><text class="cs" x="84" y="536" fill="#c62a48">WHAT IT WILL NEVER DO</text><text class="cb" x="84" y="562">Let anyone in without an account, or</text><text class="cb" x="84" y="586">let anyone see a collection they were</text><text class="cb" x="84" y="610">not given.</text><rect x="572" y="156" width="456" height="520" rx="18" fill="#ffffff" stroke="#f6e0c6" stroke-width="2"/><rect x="572" y="156" width="456" height="96" rx="18" fill="#fff7ee"/><rect x="572" y="234" width="456" height="18" fill="#fff7ee"/><g transform="translate(-0.00,-0.00) translate(626,206) scale(1.0) translate(-626,-206)"><circle cx="626" cy="206" r="17.16" fill="none" stroke="#c2680a" stroke-width="2.4"/><ellipse cx="626" cy="206" rx="7.48" ry="17.16" fill="none" stroke="#c2680a" stroke-width="2"/><path d="M608.84,206 H643.16 M611.04,198.08 H640.96 M611.04,213.92 H640.96" stroke="#c2680a" stroke-width="1.8"/></g><text class="ct" x="668" y="202">The public door</text><text class="lbl" x="668" y="226">What people call: the Publication API</text><text class="cs" x="600" y="296" fill="#c2680a">WHO GOES THROUGH IT</text><text class="cb" x="600" y="322">Your website, partner portals, and</text><text class="cb" x="600" y="346">any researcher you allow.</text><text class="cs" x="600" y="404" fill="#c2680a">WHAT THEY CAN DO</text><text class="cb" x="600" y="430">Read the published copy: records,</text><text class="cb" x="600" y="454">images, search results, and passages</text><text class="cb" x="600" y="478">of a text or a video.</text><text class="cs" x="600" y="536" fill="#c62a48">WHAT IT WILL NEVER DO</text><text class="cb" x="600" y="562">Write anything, anywhere. This door</text><text class="cb" x="600" y="586">has no handle on the inside — it can</text><text class="cb" x="600" y="610">only hand things out.</text><rect x="1088" y="156" width="456" height="520" rx="18" fill="#ffffff" stroke="#e4dafb" stroke-width="2"/><rect x="1088" y="156" width="456" height="96" rx="18" fill="#f6f1ff"/><rect x="1088" y="234" width="456" height="18" fill="#f6f1ff"/><g transform="translate(-0.00,5.28) translate(1142,206) scale(1.0) translate(-1142,-206)"><path d="M1142,187.08 v4.4" stroke="#6d28d9" stroke-width="2.4" stroke-linecap="round"/><circle cx="1142" cy="186.2" r="2.6399999999999997" fill="#6d28d9"/><rect x="1126.16" y="191.92" width="31.68" height="25.959999999999997" rx="9" fill="none" stroke="#6d28d9" stroke-width="2.4"/><circle cx="1136.28" cy="203.36" r="2.8600000000000003" fill="#6d28d9"/><circle cx="1147.72" cy="203.36" r="2.8600000000000003" fill="#6d28d9"/><path d="M1136.28,211.72 H1147.72" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round"/></g><text class="ct" x="1184" y="202">The AI door</text><text class="lbl" x="1184" y="226">What people call: MCP</text><text class="cs" x="1116" y="296" fill="#6d28d9">WHO GOES THROUGH IT</text><text class="cb" x="1116" y="322">An AI assistant you connected —</text><text class="cb" x="1116" y="346">yours, or the one your team uses.</text><text class="cs" x="1116" y="404" fill="#6d28d9">WHAT THEY CAN DO</text><text class="cb" x="1116" y="430">Exactly what the person using it may</text><text class="cb" x="1116" y="454">do. It searches and reads; it can draft</text><text class="cb" x="1116" y="478">a change for a human to confirm.</text><text class="cs" x="1116" y="536" fill="#c62a48">WHAT IT WILL NEVER DO</text><text class="cb" x="1116" y="562">See a record its user could not open,</text><text class="cb" x="1116" y="586">or save an edit that nobody confirmed.</text><rect x="56" y="716" width="1488" height="98" rx="14" fill="#f4f6f9" stroke="#dde3ea"/><text class="factt" x="80" y="749">One set of rules, checked at every door</text><text class="fact" x="80" y="776">There is no back door and no shortcut: whoever knocks — a person, your website, or an assistant — passes the same</text><text class="fact" x="80" y="800">checks, in the same order. That is why opening the AI door does not open anything else.</text><text class="foot" x="56" y="870">Dédalo — Cultural Heritage management</text>
</svg>
