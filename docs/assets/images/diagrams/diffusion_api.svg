<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1230" width="1640" height="1230" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c9d0da"/>
</marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5f6875"/>
</marker>
</defs>
<style>
  .ttl { font-size:30px; font-weight:700; fill:#171a21; }
  .sub { font-size:14.5px; fill:#5f6875; }
  .lane { font-size:11px; font-weight:700; letter-spacing:1.6px; fill:#5f6875; }
  .bt { font-size:14.5px; font-weight:650; fill:#171a21; }
  .bs { font-size:11.8px; fill:#5f6875; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:11.5px; fill:#5f6875; }
  .edge { fill:none; stroke:#c9d0da; stroke-width:1.8; }
  .edged { fill:none; stroke:#5f6875; stroke-width:1.6; stroke-dasharray:5 4; }
  .elab { font-size:10.8px; fill:#5f6875; }
  .note { font-size:12px; fill:#5f6875; }
</style>
<rect width="1640" height="1230" fill="#ffffff"/>
<text class="ttl" x="56" y="60">Dédalo v7 — the Diffusion API</text>
<text class="sub" x="56" y="86">src/diffusion/ — a control plane that only enqueues, a data plane that only publishes, and one durable job row between them</text>
<rect x="56" y="110" width="1528" height="210" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="134">CONTROL PLANE — served from the main API dispatcher</text><rect x="80" y="146" width="330" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="146" width="4" height="150" rx="2" fill="#475569"/><text class="bt" x="96" y="170">tool_diffusion (client)</text><text class="bs" x="96" y="190">the byte-identical client reaches</text><text class="bs" x="96" y="206">these actions with ZERO edits,</text><text class="bs" x="96" y="222">through its DEDALO_DIFFUSION_API_URL</text><text class="bs" x="96" y="238">fallback</text><rect x="450" y="146" width="380" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="450" y="146" width="4" height="150" rx="2" fill="#2563eb"/><text class="bt" x="466" y="170">dd_diffusion_api</text><text class="mono" xml:space="preserve" x="466" y="190">diffuse            enqueue + SSE stream</text><text class="mono" xml:space="preserve" x="466" y="206">get_process_status reconnect by id</text><text class="mono" xml:space="preserve" x="466" y="222">list_processes     progress rows</text><text class="mono" xml:space="preserve" x="466" y="238">cancel_process     cooperative cancel</text><text class="mono" xml:space="preserve" x="466" y="254">sweep_published_langs   lang audit</text><rect x="870" y="146" width="330" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="870" y="146" width="4" height="150" rx="2" fill="#be123c"/><text class="bt" x="886" y="170">AUTHORIZATION</text><text class="bs" x="886" y="190">the dispatch gates (session, CSRF,</text><text class="bs" x="886" y="206">allowlist); diffuse ALSO needs read</text><text class="bs" x="886" y="222">permission on the source section;</text><text class="bs" x="886" y="238">status / cancel / list are OWNER-</text><text class="bs" x="886" y="254">SCOPED — knowing an id grants nothing</text><rect x="1240" y="146" width="296" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1240" y="146" width="4" height="150" rx="2" fill="#475569"/><text class="bt" x="1256" y="170">Progress transport</text><text class="bs" x="1256" y="190">POLL over the durable job row at</text><text class="bs" x="1256" y="206">the 500 ms update_rate cadence.</text><text class="bs" x="1256" y="222">The queue's pg_notify is forward</text><text class="bs" x="1256" y="238">compatibility for a LISTEN push —</text><text class="bs" x="1256" y="254">nothing depends on it yet.</text><rect x="56" y="350" width="1528" height="186" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="374">QUEUE + SCHEDULER</text><rect x="80" y="386" width="430" height="130" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="386" width="4" height="130" rx="2" fill="#2563eb"/><text class="bt" x="96" y="410">the job row (Postgres)</text><text class="bs" x="96" y="430">the ONLY channel between the two planes:</text><text class="bs" x="96" y="446">state · heartbeat · progress totals ·</text><text class="bs" x="96" y="462">checkpoint · terminal result.</text><text class="bs" x="96" y="478">Zero runner↔server RPC, by design.</text><rect x="550" y="386" width="430" height="130" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="550" y="386" width="4" height="130" rx="2" fill="#0f766e"/><text class="bt" x="566" y="410">jobs/scheduler.ts</text><text class="bs" x="566" y="430">claims queued jobs, bounded by</text><text class="bs" x="566" y="446">DEDALO_DIFFUSION_MAX_RUNNERS (default 2),</text><text class="bs" x="566" y="462">and spawns ONE runner process per claim —</text><text class="bs" x="566" y="478">a runner on another machine needs no code</text><rect x="1020" y="386" width="516" height="130" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1020" y="386" width="4" height="130" rx="2" fill="#b45309"/><text class="bt" x="1036" y="410">sweeper</text><text class="bs" x="1036" y="430">at boot and on an interval: running jobs whose heartbeat went stale are</text><text class="bs" x="1036" y="446">re-queued within their attempt budget, or failed.</text><text class="bs" x="1036" y="462">This is the crash recovery a durable queue exists for.</text><rect x="56" y="570" width="1528" height="252" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="594">DATA PLANE — one runner process per job: own memory ceiling, crash-isolated from the interactive server, killable</text><rect x="80" y="642" width="280" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="642" width="4" height="150" rx="2" fill="#6d28d9"/><text class="bt" x="96" y="666">B · compile the plan</text><text class="bs" x="96" y="686">one dd1190 element → an immutable,</text><text class="bs" x="96" y="702">JSON-serializable PublicationPlan.</text><text class="bs" x="96" y="718">ALL ontology interpretation happens</text><text class="bs" x="96" y="734">HERE, once per ontology revision —</text><text class="bs" x="96" y="750">every SQL identifier validated at</text><text class="bs" x="96" y="766">compile time, never at runtime</text><rect x="382" y="642" width="280" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="382" y="642" width="4" height="150" rx="2" fill="#2563eb"/><text class="bt" x="398" y="666">C · selection</text><text class="bs" x="398" y="686">keyset batches of the primary</text><text class="bs" x="398" y="702">records, then a breadth-first</text><text class="bs" x="398" y="718">relation frontier drained level</text><text class="bs" x="398" y="734">by level and deduped per run</text><path class="edge" d="M360,717 L382,717" marker-end="url(#a)"/><rect x="684" y="642" width="280" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="684" y="642" width="4" height="150" rx="2" fill="#2563eb"/><text class="bt" x="700" y="666">D · resolution</text><text class="bs" x="700" y="686">the chain walk: component steps</text><text class="bs" x="700" y="702">read the stored slice, relation</text><text class="bs" x="700" y="718">hops load their targets. The</text><text class="bs" x="700" y="734">publication gate (is_publishable)</text><text class="bs" x="700" y="750">is FAIL-CLOSED: any error at the</text><text class="bs" x="700" y="766">gate means 'unpublish'</text><path class="edge" d="M662,717 L684,717" marker-end="url(#a)"/><rect x="986" y="642" width="280" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="986" y="642" width="4" height="150" rx="2" fill="#0f766e"/><text class="bt" x="1002" y="666">E/F · transform + project</text><text class="bs" x="1002" y="686">parsers and rewriters run in</text><text class="bs" x="1002" y="702">their original chain position,</text><text class="bs" x="1002" y="718">then the lang ladder projects</text><text class="bs" x="1002" y="734">one row set per language</text><path class="edge" d="M964,717 L986,717" marker-end="url(#a)"/><rect x="1288" y="642" width="280" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1288" y="642" width="4" height="150" rx="2" fill="#0f766e"/><text class="bt" x="1304" y="666">G · writer session</text><text class="bs" x="1304" y="686">the format writer's schema is</text><text class="bs" x="1304" y="702">ensured ONCE, then batched</text><text class="bs" x="1304" y="718">idempotent writes — and a</text><text class="bs" x="1304" y="734">committed checkpoint after</text><text class="bs" x="1304" y="750">every single batch</text><path class="edge" d="M1266,717 L1288,717" marker-end="url(#a)"/><rect x="56" y="846" width="1528" height="190" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="870">FORMAT WRITERS AND TARGETS — keyed by properties-&gt;diffusion-&gt;type; an unknown format is a LOUD typed error, never a silent no-op</text><rect x="80" y="902" width="430" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="902" width="4" height="112" rx="2" fill="#b45309"/><text class="bt" x="96" y="926">SQL writer → MariaDB</text><text class="bs" x="96" y="946">sql_generator · db · delete_record ·</text><text class="bs" x="96" y="962">lang_sweep. Bun owns MariaDB, and this</text><text class="bs" x="96" y="978">runner is its ONLY writer.</text><rect x="550" y="902" width="430" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="550" y="902" width="4" height="112" rx="2" fill="#b45309"/><text class="bt" x="566" y="926">file writers</text><text class="bs" x="566" y="946">csv · json · xml · rdf · markdown —</text><text class="bs" x="566" y="962">published files written to disk, one</text><text class="bs" x="566" y="978">registry entry per community format.</text><rect x="1020" y="902" width="516" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1020" y="902" width="4" height="112" rx="2" fill="#6d28d9"/><text class="bt" x="1036" y="926">mediastore</text><text class="bs" x="1036" y="946">media_index — the .publication marker store that the GENERATED web-server rules read,</text><text class="bs" x="1036" y="962">so a 32 GB file is never carried through the engine's byte path.</text><rect x="56" y="1064" width="1528" height="100" rx="9" fill="#f5f7fa" stroke="#c9d0da"/><rect x="56" y="1064" width="4" height="100" rx="2" fill="#15803d"/><text class="bt" x="72" y="1088">CHECKPOINT — what makes  kill -9  survivable</text><text class="bs" x="72" y="1108">After every batch the runner commits  { cursor, run_started_at, processed }  to the job row. run_started_at is captured ONCE on the first attempt and reused on resume,</text><text class="bs" x="72" y="1124">so the publish_timestamp system field stays deterministic and a killed, re-queued job resumes BYTE-EQUIVALENT to the run it interrupted.</text><path class="edge" d="M410,221 L450,221" marker-end="url(#a)"/><path class="edge" d="M830,221 L870,221" marker-end="url(#a)"/><path class="edge" d="M640,296 L640,326 L295,326 L295,386" marker-end="url(#a)"/><text class="elab" x="470" y="319" text-anchor="middle">enqueue a durable job</text><path class="edge" d="M510,451 L550,451" marker-end="url(#a)"/><text class="elab" x="530.0" y="444.0" text-anchor="middle">claim</text><path class="edge" d="M980,451 L1020,451" marker-end="url(#a)"/><path class="edge" d="M765,516 L765,560 L220,560 L220,642" marker-end="url(#a)"/><text class="elab" x="520" y="553" text-anchor="middle">spawn:  bun run src/diffusion/runner.ts --job &lt;uuid&gt;</text><path class="edged" d="M80,700 L64,700 L64,536 L200,536 L200,516" marker-end="url(#ad)"/><text class="elab" x="100" y="632" text-anchor="start">heartbeat · progress · checkpoint</text><path class="edge" d="M1428,792 L1428,832 L295,832 L295,902" marker-end="url(#a)"/><text class="note" x="56" y="1202">Actions in src/diffusion/api/ · plan, resolve, writers and targets under src/diffusion/ · the runner talks to nothing but Postgres and the publication targets · spec: engineering/DIFFUSION_SPEC.md</text>
</svg>
