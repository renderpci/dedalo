<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs>
<style>
 .t1{font-size:40px;font-weight:750;fill:#14161b}
 .t2{font-size:20px;fill:#4f5967}
 .zl{font-size:15px;font-weight:750;letter-spacing:1.3px}
 .ct{font-size:22px;font-weight:700;fill:#14161b}
 .cs{font-size:14px;font-weight:700;letter-spacing:1.1px}
 .cb{font-size:16.5px;fill:#4f5967}
 .num{font-size:25px;font-weight:750;fill:#ffffff}
 .fact{font-size:17px;fill:#4f5967}
 .factt{font-size:18px;font-weight:700;fill:#14161b}
 .lbl{font-size:14.5px;fill:#4f5967}
 .quote{font-size:17px;fill:#14161b;font-style:italic}
 .edge{fill:none;stroke:#9aa4b2;stroke-width:2.2}
 .foot{font-size:15px;fill:#7b8593}
</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="t1" x="56" y="70">The journey of one record</text>
<text class="t2" x="56" y="104">From the day someone catalogues it, to the day a visitor — or an AI assistant — finds it.</text>
<rect x="56" y="170" width="456" height="220" rx="14" fill="#ffffff" stroke="#d3e0fc" stroke-width="1.6"/><circle cx="102" cy="204" r="22" fill="#2563eb"/><text class="num" x="102" y="213" text-anchor="middle">1</text><text class="ct" x="136" y="212">Someone catalogues it</text><text class="cb" x="80" y="246">An archivist describes a photograph, an</text><text class="cb" x="80" y="271">interview, an object or a document, in the</text><text class="cb" x="80" y="296">form your institution designed for it —</text><text class="cb" x="80" y="321">in as many languages as you work in.</text><g transform="translate(-0.00,-0.00) translate(466,204) scale(0.97) translate(-466,-204)"><rect x="452.0" y="188.0" width="28.0" height="32.0" rx="6" fill="none" stroke="#2563eb" stroke-width="2.4"/><path d="M457.6,196.4 H474.4 M457.6,204 H474.4 M457.6,211.6 H468.4" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/></g><rect x="572" y="170" width="456" height="220" rx="14" fill="#ffffff" stroke="#d3e0fc" stroke-width="1.6"/><circle cx="618" cy="204" r="22" fill="#2563eb"/><text class="num" x="618" y="213" text-anchor="middle">2</text><text class="ct" x="652" y="212">Dédalo keeps every version</text><text class="cb" x="596" y="246">One record, in one place. Every edit is</text><text class="cb" x="596" y="271">kept: who made it, and when.</text><text class="cb" x="596" y="296"></text><text class="cb" x="596" y="321">So you can always look back, and go back.</text><g transform="translate(-0.00,-0.00) translate(982,204) scale(1.05) translate(-982,-204)"><path d="M966.4,194.4 v19.2 a15.600000000000001,5.2 0 0 0 31.200000000000003,0 v-19.2" fill="none" stroke="#2563eb" stroke-width="2.4"/><ellipse cx="982" cy="194.4" rx="15.600000000000001" ry="5.2" fill="none" stroke="#2563eb" stroke-width="2.4"/><ellipse cx="982" cy="203.0" rx="15.600000000000001" ry="5.2" fill="none" stroke="#2563eb" stroke-width="1.6" opacity="0.55"/></g><path class="edge" d="M512,280 L560,280" marker-end="url(#a)"/><rect x="1088" y="170" width="456" height="220" rx="14" fill="#ffffff" stroke="#f6e0c6" stroke-width="1.6"/><circle cx="1134" cy="204" r="22" fill="#c2680a"/><text class="num" x="1134" y="213" text-anchor="middle">3</text><text class="ct" x="1168" y="212">You decide it may be public</text><text class="cb" x="1112" y="246">Publication is a decision you take, record</text><text class="cb" x="1112" y="271">by record. Until you take it, the record</text><text class="cb" x="1112" y="296">lives only inside the institution.</text><text class="cb" x="1112" y="321"></text><text class="cb" x="1112" y="346">You can also decide it is public no more.</text><g transform="translate(-0.00,-0.00) translate(1498,204) scale(1.0) translate(-1498,-204)"><circle cx="1498" cy="204" r="15.600000000000001" fill="none" stroke="#c2680a" stroke-width="2.4"/><path d="M1490.8,204.4 l5.2,5.6000000000000005 l10.0,-11.200000000000001" fill="none" stroke="#c2680a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path class="edge" d="M1028,280 L1076,280" marker-end="url(#a)"/><rect x="56" y="452" width="456" height="220" rx="14" fill="#ffffff" stroke="#f6e0c6" stroke-width="1.6"/><circle cx="102" cy="486" r="22" fill="#c2680a"/><text class="num" x="102" y="495" text-anchor="middle">4</text><text class="ct" x="136" y="494">Dédalo publishes it</text><text class="cb" x="80" y="528">A background job copies the marked records</text><text class="cb" x="80" y="553">into the published database, and writes the</text><text class="cb" x="80" y="578">formats you asked for: CSV, XML, RDF,</text><text class="cb" x="80" y="603">Markdown.</text><text class="cb" x="80" y="628"></text><text class="cb" x="80" y="653">It runs on its own. Nobody waits for it.</text><g transform="translate(-0.00,-0.00) translate(466,486) scale(1.0) translate(-466,-486)"><path d="M455.0,470.4 h14.399999999999999 l7.6,7.6 v23.599999999999998 h-22.0 Z" fill="none" stroke="#c2680a" stroke-width="2.4" stroke-linejoin="round"/><path d="M460.0,484.0 H472.0 M460.0,490.0 H472.0" stroke="#c2680a" stroke-width="2" stroke-linecap="round"/></g><rect x="572" y="452" width="456" height="220" rx="14" fill="#ffffff" stroke="#c9edda" stroke-width="1.6"/><circle cx="618" cy="486" r="22" fill="#14804a"/><text class="num" x="618" y="495" text-anchor="middle">5</text><text class="ct" x="652" y="494">The world reads it</text><text class="cb" x="596" y="528">Your website, a partner portal or a</text><text class="cb" x="596" y="553">researcher's script reads that published</text><text class="cb" x="596" y="578">copy through the public API.</text><text class="cb" x="596" y="603"></text><text class="cb" x="596" y="628">Always the copy. Never your catalogue.</text><g transform="translate(-0.00,-0.00) translate(982,486) scale(1.0) translate(-982,-486)"><circle cx="982" cy="486" r="15.600000000000001" fill="none" stroke="#14804a" stroke-width="2.4"/><ellipse cx="982" cy="486" rx="6.800000000000001" ry="15.600000000000001" fill="none" stroke="#14804a" stroke-width="2"/><path d="M966.4,486 H997.6 M968.4,478.8 H995.6 M968.4,493.2 H995.6" stroke="#14804a" stroke-width="1.8"/></g><path class="edge" d="M512,562 L560,562" marker-end="url(#a)"/><rect x="1088" y="452" width="456" height="220" rx="14" fill="#ffffff" stroke="#e4dafb" stroke-width="1.6"/><circle cx="1134" cy="486" r="22" fill="#6d28d9"/><text class="num" x="1134" y="495" text-anchor="middle">6</text><text class="ct" x="1168" y="494">It can be found by meaning</text><text class="cb" x="1112" y="528">If you switch it on, the same record can</text><text class="cb" x="1112" y="553">be found by what it is ABOUT — and read</text><text class="cb" x="1112" y="578">by an AI assistant, under the same</text><text class="cb" x="1112" y="603">permissions as the person asking.</text><g transform="translate(-0.42,-0.42) translate(1498,486) scale(1.05) translate(-1498,-486)"><path d="M1495.0,471.6 Q1497.232,481.768 1507.4,484.0 Q1497.232,486.232 1495.0,496.4 Q1492.768,486.232 1482.6,484.0 Q1492.768,481.768 1495.0,471.6 Z" fill="#6d28d9"/><path d="M1508.0,489.0 Q1509.08,493.92 1514.0,495.0 Q1509.08,496.08 1508.0,501.0 Q1506.92,496.08 1502.0,495.0 Q1506.92,493.92 1508.0,489.0 Z" fill="#6d28d9"/></g><path class="edge" d="M1028,562 L1076,562" marker-end="url(#a)"/><path class="edge" d="M1316,390 C1316,418 1316,418 1250,418 L350,418 C284,418 284,418 284,452" marker-end="url(#a)"/><text class="lbl" x="800" y="410" text-anchor="middle" font-weight="700">the same record, later</text><rect x="56" y="724" width="1488" height="106" rx="14" fill="#f4f6f9" stroke="#dde3ea"/><text class="factt" x="80" y="759">Two promises worth remembering</text><text class="fact" x="80" y="787">Nothing is published by accident — step 3 is a human decision, taken record by record, and it can be undone.</text><text class="fact" x="80" y="812">And nothing is ever silently lost — step 2 keeps every version, so a mistake is always recoverable.</text><text class="foot" x="56" y="870">Dédalo — Cultural Heritage management</text>
</svg>
