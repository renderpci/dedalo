<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs>
<style>
 .t1{font-size:40px;font-weight:750;fill:#14161b}
 .t2{font-size:20px;fill:#4f5967}
 .zl{font-size:15px;font-weight:750;letter-spacing:1.3px}
 .ct{font-size:22px;font-weight:700;fill:#14161b}
 .cs{font-size:14px;font-weight:700;letter-spacing:1.1px}
 .cb{font-size:16.5px;fill:#4f5967}
 .num{font-size:25px;font-weight:750;fill:#ffffff}
 .fact{font-size:17px;fill:#4f5967}
 .factt{font-size:18px;font-weight:700;fill:#14161b}
 .lbl{font-size:14.5px;fill:#4f5967}
 .quote{font-size:17px;fill:#14161b;font-style:italic}
 .edge{fill:none;stroke:#9aa4b2;stroke-width:2.2}
 .foot{font-size:15px;fill:#7b8593}
</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="t1" x="56" y="70">Where everything lives</text>
<text class="t2" x="56" y="104">Dédalo runs in two separate places — and only one of them faces the internet.</text>
<rect x="56" y="150" width="430" height="552" rx="20" fill="#eff4ff" stroke="#d3e0fc" stroke-width="2"/><text class="zl" x="86" y="188" fill="#2563eb">INSIDE YOUR INSTITUTION</text><rect x="86" y="196" width="370" height="108" rx="14" fill="#ffffff" stroke="#d3e0fc" stroke-width="1.6"/><g transform="translate(-0.00,1.30) translate(132,230) scale(1.3) translate(-132,-230)"><circle cx="123.0" cy="222.02" r="5.7" fill="#2563eb"/><path d="M111.22,241.78 C111.22,228.86 134.78,228.86 134.78,241.78 Z" fill="#2563eb"/><circle cx="141.0" cy="222.02" r="5.7" fill="#2563eb"/><path d="M129.22,241.78 C129.22,228.86 152.78,228.86 152.78,241.78 Z" fill="#2563eb"/></g><text class="ct" x="166" y="238">Your team</text><text class="cb" x="110" y="272">Curators, researchers and archivists,</text><text class="cb" x="110" y="297">each with a personal account.</text><rect x="86" y="324" width="370" height="108" rx="14" fill="#ffffff" stroke="#d3e0fc" stroke-width="1.6"/><g transform="translate(-0.00,-3.00) translate(132,358) scale(1.25) translate(-132,-358)"><rect x="116.0" y="348.0" width="32.0" height="12.4" rx="6" fill="none" stroke="#2563eb" stroke-width="2.4"/><circle cx="122.0" cy="354.2" r="1.7999999999999998" fill="#2563eb"/><path d="M128.0,354.2 H143.0" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><rect x="116.0" y="360.4" width="32.0" height="12.4" rx="6" fill="none" stroke="#2563eb" stroke-width="2.4"/><circle cx="122.0" cy="366.59999999999997" r="1.7999999999999998" fill="#2563eb"/><path d="M128.0,366.59999999999997 H143.0" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/></g><text class="ct" x="166" y="366">The Dédalo server</text><text class="cb" x="110" y="400">One program, on one computer,</text><text class="cb" x="110" y="425">on your own network.</text><rect x="86" y="452" width="370" height="130" rx="14" fill="#ffffff" stroke="#d3e0fc" stroke-width="1.6"/><g transform="translate(-0.00,-0.00) translate(132,486) scale(1.05) translate(-132,-486)"><path d="M116.4,476.4 v19.2 a15.600000000000001,5.2 0 0 0 31.200000000000003,0 v-19.2" fill="none" stroke="#2563eb" stroke-width="2.4"/><ellipse cx="132" cy="476.4" rx="15.600000000000001" ry="5.2" fill="none" stroke="#2563eb" stroke-width="2.4"/><ellipse cx="132" cy="485.0" rx="15.600000000000001" ry="5.2" fill="none" stroke="#2563eb" stroke-width="1.6" opacity="0.55"/></g><text class="ct" x="166" y="494">The catalogue</text><text class="cb" x="110" y="528">Every record, image and version.</text><text class="cb" x="110" y="553">The original — and the only</text><text class="cb" x="110" y="578">original there is.</text><text class="fact" x="101" y="632">Private. Nothing here can be reached</text><text class="fact" x="101" y="656">from the internet.</text><rect x="606" y="150" width="390" height="552" rx="20" fill="#fff7ee" stroke="#f6e0c6" stroke-width="2"/><text class="zl" x="636" y="188" fill="#c2680a">ON THE WEB SERVER</text><rect x="636" y="196" width="330" height="130" rx="14" fill="#ffffff" stroke="#f6e0c6" stroke-width="1.6"/><g transform="translate(-0.00,-0.00) translate(682,230) scale(1.05) translate(-682,-230)"><path d="M666.4,220.4 v19.2 a15.600000000000001,5.2 0 0 0 31.200000000000003,0 v-19.2" fill="none" stroke="#c2680a" stroke-width="2.4"/><ellipse cx="682" cy="220.4" rx="15.600000000000001" ry="5.2" fill="none" stroke="#c2680a" stroke-width="2.4"/><ellipse cx="682" cy="229.0" rx="15.600000000000001" ry="5.2" fill="none" stroke="#c2680a" stroke-width="1.6" opacity="0.55"/></g><text class="ct" x="716" y="238">The published copy</text><text class="cb" x="660" y="272">Only the records you marked</text><text class="cb" x="660" y="297">as public. A copy — never</text><text class="cb" x="660" y="322">the original.</text><rect x="636" y="346" width="330" height="130" rx="14" fill="#ffffff" stroke="#f6e0c6" stroke-width="1.6"/><g transform="translate(-0.00,-0.00) translate(682,380) scale(1.0) translate(-682,-380)"><rect x="669.6" y="378.0" width="24.8" height="17.2" rx="7" fill="#c2680a"/><path d="M674.8,377.6 v-6.0 a7.199999999999999,7.199999999999999 0 0 1 14.399999999999999,0 v6.0" fill="none" stroke="#c2680a" stroke-width="2.6"/></g><text class="ct" x="716" y="388">The public API</text><text class="cb" x="660" y="422">Hands that copy out to whoever</text><text class="cb" x="660" y="447">asks. It can read, and it can</text><text class="cb" x="660" y="472">do nothing else.</text><rect x="636" y="496" width="330" height="108" rx="14" fill="#ffffff" stroke="#f6e0c6" stroke-width="1.6"/><g transform="translate(-0.00,-0.00) translate(682,530) scale(1.0) translate(-682,-530)"><path d="M671.0,514.4 h14.399999999999999 l7.6,7.6 v23.599999999999998 h-22.0 Z" fill="none" stroke="#c2680a" stroke-width="2.4" stroke-linejoin="round"/><path d="M676.0,528.0 H688.0 M676.0,534.0 H688.0" stroke="#c2680a" stroke-width="2" stroke-linecap="round"/></g><text class="ct" x="716" y="538">Files, if you prefer</text><text class="cb" x="660" y="572">The same data as CSV, XML,</text><text class="cb" x="660" y="597">RDF or Markdown files.</text><text class="fact" x="651" y="652">A copy, not a window.</text><rect x="1116" y="150" width="428" height="552" rx="20" fill="#eefaf3" stroke="#c9edda" stroke-width="2"/><text class="zl" x="1146" y="188" fill="#14804a">THE WORLD</text><rect x="1146" y="196" width="368" height="108" rx="14" fill="#ffffff" stroke="#c9edda" stroke-width="1.6"/><g transform="translate(-0.00,-0.00) translate(1192,230) scale(1.0) translate(-1192,-230)"><circle cx="1192" cy="230" r="15.600000000000001" fill="none" stroke="#14804a" stroke-width="2.4"/><ellipse cx="1192" cy="230" rx="6.800000000000001" ry="15.600000000000001" fill="none" stroke="#14804a" stroke-width="2"/><path d="M1176.4,230 H1207.6 M1178.4,222.8 H1205.6 M1178.4,237.2 H1205.6" stroke="#14804a" stroke-width="1.8"/></g><text class="ct" x="1226" y="238">Your website</text><text class="cb" x="1170" y="272">Built from the published copy,</text><text class="cb" x="1170" y="297">always up to date.</text><rect x="1146" y="324" width="368" height="108" rx="14" fill="#ffffff" stroke="#c9edda" stroke-width="1.6"/><g transform="translate(-0.00,1.26) translate(1192,358) scale(1.26) translate(-1192,-358)"><circle cx="1192.0" cy="349.6" r="6.0" fill="#14804a"/><path d="M1179.6,370.4 C1179.6,356.8 1204.4,356.8 1204.4,370.4 Z" fill="#14804a"/></g><text class="ct" x="1226" y="366">Visitors and researchers</text><text class="cb" x="1170" y="400">Anyone you decided to open</text><text class="cb" x="1170" y="425">the collection to.</text><rect x="1146" y="452" width="368" height="130" rx="14" fill="#ffffff" stroke="#c9edda" stroke-width="1.6"/><g transform="translate(-0.00,4.80) translate(1192,486) scale(1.0) translate(-1192,-486)"><path d="M1192,468.8 v4.0" stroke="#14804a" stroke-width="2.4" stroke-linecap="round"/><circle cx="1192" cy="468.0" r="2.4" fill="#14804a"/><rect x="1177.6" y="473.2" width="28.799999999999997" height="23.599999999999998" rx="9" fill="none" stroke="#14804a" stroke-width="2.4"/><circle cx="1186.8" cy="483.6" r="2.6" fill="#14804a"/><circle cx="1197.2" cy="483.6" r="2.6" fill="#14804a"/><path d="M1186.8,491.2 H1197.2" stroke="#14804a" stroke-width="2.2" stroke-linecap="round"/></g><text class="ct" x="1226" y="494">AI assistants</text><text class="cb" x="1170" y="528">Only if you switch them on,</text><text class="cb" x="1170" y="553">and only for the data you</text><text class="cb" x="1170" y="578">chose to publish.</text><text class="fact" x="1161" y="652">Nobody out here ever touches the catalogue.</text><path class="edge" d="M486,400 L606,400" marker-end="url(#a)"/><text class="lbl" x="546" y="372" text-anchor="middle" font-weight="700">you choose</text><text class="lbl" x="546" y="392" text-anchor="middle">what to publish</text><path class="edge" d="M996,400 L1116,400" marker-end="url(#a)"/><text class="lbl" x="1056" y="372" text-anchor="middle" font-weight="700">read only</text><text class="lbl" x="1056" y="392" text-anchor="middle">one way</text><rect x="56" y="756" width="440" height="98" rx="14" fill="#f4f6f9" stroke="#dde3ea"/><text class="factt" x="80" y="789">One direction only</text><text class="fact" x="80" y="815">Data flows outwards. There is no route from</text><text class="fact" x="80" y="837">the website back into your catalogue.</text><rect x="580" y="756" width="440" height="98" rx="14" fill="#f4f6f9" stroke="#dde3ea"/><text class="factt" x="604" y="789">Separate machines</text><text class="fact" x="604" y="815">If the public site is attacked or goes down,</text><text class="fact" x="604" y="837">your archive keeps working, untouched.</text><rect x="1104" y="756" width="440" height="98" rx="14" fill="#f4f6f9" stroke="#dde3ea"/><text class="factt" x="1128" y="789">You decide, record by record</text><text class="fact" x="1128" y="815">Nothing becomes public by accident.</text><text class="fact" x="1128" y="837">Publication is a decision, not a default.</text><text class="foot" x="56" y="870">Dédalo — Cultural Heritage management</text>
</svg>
