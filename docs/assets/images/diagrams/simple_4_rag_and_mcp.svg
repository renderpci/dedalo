<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs>
<style>
 .t1{font-size:40px;font-weight:750;fill:#14161b}
 .t2{font-size:20px;fill:#4f5967}
 .zl{font-size:15px;font-weight:750;letter-spacing:1.3px}
 .ct{font-size:22px;font-weight:700;fill:#14161b}
 .cs{font-size:14px;font-weight:700;letter-spacing:1.1px}
 .cb{font-size:16.5px;fill:#4f5967}
 .num{font-size:25px;font-weight:750;fill:#ffffff}
 .fact{font-size:17px;fill:#4f5967}
 .factt{font-size:18px;font-weight:700;fill:#14161b}
 .lbl{font-size:14.5px;fill:#4f5967}
 .quote{font-size:17px;fill:#14161b;font-style:italic}
 .edge{fill:none;stroke:#9aa4b2;stroke-width:2.2}
 .foot{font-size:15px;fill:#7b8593}
</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="t1" x="56" y="70">Ready for AI — and on your terms</text>
<text class="t2" x="56" y="104">Two pieces are already built. Both are optional, both are off until you turn them on.</text>
<rect x="56" y="150" width="740" height="566" rx="20" fill="#eff8fb" stroke="#cfe8f0" stroke-width="2"/><text class="zl" x="86" y="188" fill="#0e7490">RAG  ·  FINDING THINGS BY WHAT THEY MEAN</text><g transform="translate(-0.00,-0.44) translate(738,182) scale(1.1) translate(-738,-182)"><circle cx="735.2" cy="179.2" r="11.0" fill="none" stroke="#0e7490" stroke-width="2.6"/><path d="M743.6,187.6 L752.4,196.4" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/></g><rect x="86" y="204" width="680" height="86" rx="14" fill="#ffffff" stroke="#cfe8f0"/><g transform="translate(-0.00,-0.00) translate(128,247) scale(1.03) translate(-128,-247)"><path d="M116.0,235.0 H140.0 A3.5999999999999996,3.5999999999999996 0 0 1 143.6,238.6 V250.6 A3.5999999999999996,3.5999999999999996 0 0 1 140.0,254.2 H130.0 L124.8,261.8 V254.2 H116.0 A3.5999999999999996,3.5999999999999996 0 0 1 112.4,250.6 V238.6 A3.5999999999999996,3.5999999999999996 0 0 1 116.0,235.0 Z" fill="none" stroke="#0e7490" stroke-width="2.4" stroke-linejoin="round"/></g><text class="quote" x="166" y="242">“Which testimonies talk about people who had to</text><text class="quote" x="166" y="266">leave their homes because of a dam?”</text><rect x="86" y="312" width="330" height="188" rx="14" fill="#ffffff" stroke="#dde3ea"/><text class="cs" x="110" y="344" fill="#475569">A WORD SEARCH FINDS</text><text class="cb" x="110" y="378">Only the records where somebody</text><text class="cb" x="110" y="402">actually wrote the word.</text><text class="quote" x="110" y="440">“…the reservoir works…”</text><text class="cb" x="110" y="474">and misses all the rest.</text><rect x="436" y="312" width="330" height="188" rx="14" fill="#ffffff" stroke="#cfe8f0" stroke-width="2"/><text class="cs" x="460" y="344" fill="#0e7490">DÉDALO FINDS ALSO</text><text class="quote" x="460" y="378">“when the water came and</text><text class="quote" x="460" y="402">we had to leave”</text><text class="quote" x="460" y="436">“el pantano”</text><text class="quote" x="460" y="470">“they flooded our houses”</text><text class="factt" x="86" y="556">How it works, in one line each</text><text class="fact" x="86" y="586">1.  Dédalo reads the records you choose and stores what they MEAN, as numbers.</text><text class="fact" x="86" y="611">2.  A question is turned into the same kind of number.</text><text class="fact" x="86" y="636">3.  The closest meanings come back — each one citing the record it came from,</text><text class="fact" x="86" y="661">     so a researcher can open it and judge for themselves.</text><rect x="836" y="150" width="708" height="566" rx="20" fill="#f6f1ff" stroke="#e4dafb" stroke-width="2"/><text class="zl" x="866" y="188" fill="#6d28d9">MCP  ·  A SAFE PLUG FOR AI ASSISTANTS</text><g transform="translate(-0.00,4.80) translate(1486,182) scale(1.0) translate(-1486,-182)"><path d="M1486,164.8 v4.0" stroke="#6d28d9" stroke-width="2.4" stroke-linecap="round"/><circle cx="1486" cy="164.0" r="2.4" fill="#6d28d9"/><rect x="1471.6" y="169.2" width="28.799999999999997" height="23.599999999999998" rx="9" fill="none" stroke="#6d28d9" stroke-width="2.4"/><circle cx="1480.8" cy="179.6" r="2.6" fill="#6d28d9"/><circle cx="1491.2" cy="179.6" r="2.6" fill="#6d28d9"/><path d="M1480.8,187.2 H1491.2" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round"/></g><rect x="866" y="204" width="648" height="86" rx="14" fill="#ffffff" stroke="#e4dafb"/><text class="cb" x="898" y="240">MCP is an agreed way for an AI assistant to use another program.</text><text class="cb" x="898" y="266">Dédalo speaks it — so assistants can work WITH your catalogue.</text><rect x="866" y="306" width="648" height="112" rx="14" fill="#ffffff" stroke="#e4dafb"/><circle cx="904" cy="346" r="19" fill="#6d28d9"/><text class="num" x="904" y="354" text-anchor="middle" font-size="21">1</text><text class="ct" x="938" y="352" font-size="19">It asks Dédalo — never the other way round</text><text class="cb" x="938" y="382">Your data is not handed to a model to keep.</text><text class="cb" x="938" y="405">The assistant asks a question and gets an answer.</text><rect x="866" y="428" width="648" height="112" rx="14" fill="#ffffff" stroke="#e4dafb"/><circle cx="904" cy="468" r="19" fill="#6d28d9"/><text class="num" x="904" y="476" text-anchor="middle" font-size="21">2</text><text class="ct" x="938" y="474" font-size="19">It sees only what its user may see</text><text class="cb" x="938" y="504">An assistant working for a colleague sees that</text><text class="cb" x="938" y="527">colleague's collections. No more, ever.</text><rect x="866" y="550" width="648" height="112" rx="14" fill="#ffffff" stroke="#e4dafb"/><circle cx="904" cy="590" r="19" fill="#6d28d9"/><text class="num" x="904" y="598" text-anchor="middle" font-size="21">3</text><text class="ct" x="938" y="596" font-size="19">It proposes; a person decides</text><text class="cb" x="938" y="626">When it wants to change something, it writes a</text><text class="cb" x="938" y="649">plan you read and confirm. It cannot save on its own.</text><text class="fact" x="866" y="692">Works with the assistants your team already uses — or a local model that never leaves.</text><rect x="56" y="752" width="1488" height="98" rx="14" fill="#f4f6f9" stroke="#dde3ea"/><text class="factt" x="80" y="785">Built, and under your control</text><text class="fact" x="80" y="812">Both are switched off until an administrator turns them on. You choose which collections take part — and a sensitive</text><text class="fact" x="80" y="836">collection can be excluded from anything that would leave the institution, while still being searchable inside it.</text><text class="foot" x="56" y="870">Dédalo — Cultural Heritage management</text>
</svg>
