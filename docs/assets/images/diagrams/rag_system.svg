<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1180" width="1640" height="1180" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c9d0da"/>
</marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5f6875"/>
</marker>
</defs>
<style>
  .ttl { font-size:30px; font-weight:700; fill:#171a21; }
  .sub { font-size:14.5px; fill:#5f6875; }
  .lane { font-size:11px; font-weight:700; letter-spacing:1.6px; fill:#5f6875; }
  .bt { font-size:14.5px; font-weight:650; fill:#171a21; }
  .bs { font-size:11.8px; fill:#5f6875; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:11.5px; fill:#5f6875; }
  .edge { fill:none; stroke:#c9d0da; stroke-width:1.8; }
  .edged { fill:none; stroke:#5f6875; stroke-width:1.6; stroke-dasharray:5 4; }
  .elab { font-size:10.8px; fill:#5f6875; }
  .note { font-size:12px; fill:#5f6875; }
</style>
<rect width="1640" height="1180" fill="#ffffff"/>
<text class="ttl" x="56" y="60">Dédalo v7 — RAG subsystem</text>
<text class="sub" x="56" y="86">src/ai/rag/ — group-based indexing into pgvector, hybrid retrieval, and grounded answers that are ACL-gated exactly where humans are</text>
<rect x="56" y="110" width="1528" height="320" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="134">INDEXING — WRITE SIDE</text><rect x="80" y="146" width="228" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="146" width="4" height="100" rx="2" fill="#475569"/><text class="bt" x="96" y="170">Record save</text><text class="bs" x="96" y="190">save_component.ts</text><text class="bs" x="96" y="206">(the editor write path)</text><rect x="352" y="146" width="268" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="352" y="146" width="4" height="100" rx="2" fill="#475569"/><text class="bt" x="368" y="170">rag_index_queue</text><text class="bs" x="368" y="190">dirty marker in the MATRIX db,</text><text class="bs" x="368" y="206">on the SAME connection as the save;</text><text class="bs" x="368" y="222">enqueue is BEST-EFFORT</text><rect x="664" y="146" width="252" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="664" y="146" width="4" height="100" rx="2" fill="#475569"/><text class="bt" x="680" y="170">drain()</text><text class="bs" x="680" y="190">single-flight advisory lock,</text><text class="bs" x="680" y="206">exponential backoff, capped attempts,</text><text class="bs" x="680" y="222">a mid-drain edit is preserved</text><rect x="960" y="146" width="248" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="960" y="146" width="4" height="100" rx="2" fill="#2563eb"/><text class="bt" x="976" y="170">indexer.ts</text><text class="bs" x="976" y="190">orchestrates ONE record;</text><text class="bs" x="976" y="206">every failure is SOFT →</text><text class="bs" x="976" y="222">the queue retries</text><rect x="1252" y="146" width="284" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1252" y="146" width="4" height="100" rx="2" fill="#6d28d9"/><text class="bt" x="1268" y="170">image_source</text><text class="bs" x="1268" y="190">object images → joint-tower</text><text class="bs" x="1268" y="206">vectors; gated by</text><text class="bs" x="1268" y="222">DEDALO_RAG_MEDIA_ENABLED</text><rect x="80" y="274" width="300" height="132" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="274" width="4" height="132" rx="2" fill="#2563eb"/><text class="bt" x="96" y="298">embed_source</text><text class="bs" x="96" y="318">section_map `rag.embed` names ddo_map</text><text class="bs" x="96" y="334">GROUPS → ONE composite doc per</text><text class="bs" x="96" y="350">(group, lang), deep relation resolution</text><text class="bs" x="96" y="366">through the read path's request_config</text><rect x="418" y="274" width="250" height="132" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="418" y="274" width="4" height="132" rx="2" fill="#2563eb"/><text class="bt" x="434" y="298">chunker</text><text class="bs" x="434" y="318">structure-aware, semantic;</text><text class="bs" x="434" y="334">header-enriched EMBED text,</text><text class="bs" x="434" y="350">clean text kept for citation</text><rect x="706" y="274" width="250" height="132" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="706" y="274" width="4" height="132" rx="2" fill="#2563eb"/><text class="bt" x="722" y="298">hash diff</text><text class="bs" x="722" y="318">against the stored source_hash</text><text class="bs" x="722" y="334">— unchanged chunks are</text><text class="bs" x="722" y="350">never re-embedded</text><rect x="994" y="274" width="250" height="132" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="994" y="274" width="4" height="132" rx="2" fill="#0f766e"/><text class="bt" x="1010" y="298">EmbeddingProvider</text><text class="bs" x="1010" y="318">injected interface: batch embed</text><text class="bs" x="1010" y="334">(deterministic local provider in</text><text class="bs" x="1010" y="350">CI, API-backed in production)</text><rect x="1282" y="274" width="254" height="132" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1282" y="274" width="4" height="132" rx="2" fill="#0f766e"/><text class="bt" x="1298" y="298">upsert + prune</text><text class="bs" x="1298" y="318">atomic row upsert, then prune</text><text class="bs" x="1298" y="334">stale tails AND whole groups</text><text class="bs" x="1298" y="350">the descriptor no longer declares</text><rect x="56" y="470" width="1528" height="172" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="494">STORES — TWO DATABASES, NEVER JOINED</text><rect x="80" y="506" width="700" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="506" width="4" height="112" rx="2" fill="#475569"/><text class="bt" x="96" y="530">MATRIX database</text><text class="bs" x="96" y="550">rag_index_queue — the dirty markers, written by the editor's own transaction</text><text class="bs" x="96" y="566">matrix_* records — the text and media every embed document is resolved from</text><rect x="812" y="506" width="724" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="812" y="506" width="4" height="112" rx="2" fill="#0f766e"/><text class="bt" x="828" y="530">RAG database (pgvector)</text><text class="bs" x="828" y="550">rag_embeddings — ONE row per CHUNK, LIST-partitioned by model</text><text class="bs" x="828" y="566">keyed (section_tipo, section_id, component_tipo = rag:&lt;group&gt;, lang, chunk_index, model, dim)</text><text class="bs" x="828" y="582">pgvector cosine index + unaccent FTS GIN index — the store holds NO ACL logic</text><rect x="56" y="680" width="1528" height="248" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="704">RETRIEVAL — READ SIDE</text><rect x="80" y="716" width="300" height="194" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="716" width="4" height="194" rx="2" fill="#2563eb"/><text class="bt" x="96" y="740">dd_rag_api</text><text class="mono" xml:space="preserve" x="96" y="760">semantic_search   best record per hit</text><text class="mono" xml:space="preserve" x="96" y="776">retrieve          passages</text><text class="mono" xml:space="preserve" x="96" y="792">get_agent_context LLM context</text><text class="mono" xml:space="preserve" x="96" y="808">similar_to        records like a seed</text><text class="mono" xml:space="preserve" x="96" y="824">ask               grounded answer</text><text class="mono" xml:space="preserve" x="96" y="840">embed_groups      capability probe</text><text class="mono" xml:space="preserve" x="96" y="856">similar_objects | search_by_text_image</text><text class="mono" xml:space="preserve" x="96" y="872">characterize_object     (image layer)</text><rect x="418" y="720" width="250" height="84" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="418" y="720" width="4" height="84" rx="2" fill="#0f766e"/><text class="bt" x="434" y="744">Dense leg</text><text class="bs" x="434" y="764">pgvector cosine ANN over</text><text class="bs" x="434" y="780">the query embedding</text><rect x="418" y="824" width="250" height="84" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="418" y="824" width="4" height="84" rx="2" fill="#b45309"/><text class="bt" x="434" y="848">Lexical leg</text><text class="bs" x="434" y="868">Postgres full text (simple</text><text class="bs" x="434" y="884">config + unaccent), GIN</text><rect x="706" y="768" width="228" height="92" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="706" y="768" width="4" height="92" rx="2" fill="#475569"/><text class="bt" x="722" y="792">RRF fusion</text><text class="bs" x="722" y="812">reciprocal rank fusion,</text><text class="bs" x="722" y="828">k = 60 — incomparable</text><text class="bs" x="722" y="844">scores are never normalised</text><rect x="972" y="744" width="300" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="972" y="744" width="4" height="140" rx="2" fill="#be123c"/><text class="bt" x="988" y="768">ACL GATE</text><text class="bs" x="988" y="788">1. schema ACL — getPermissions(principal,</text><text class="bs" x="988" y="804">     section_tipo, component_tipo) ≥ 1</text><text class="bs" x="988" y="820">2. per-record projects ACL — a principal-</text><text class="bs" x="988" y="836">     scoped existence search (buildSearchSql)</text><text class="bs" x="988" y="852">A hit is never an oracle: outside your</text><text class="bs" x="988" y="868">scope you do not learn that it exists.</text><rect x="1310" y="768" width="226" height="92" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1310" y="768" width="4" height="92" rx="2" fill="#475569"/><text class="bt" x="1326" y="792">collapse</text><text class="bs" x="1326" y="812">best chunk per record;</text><text class="bs" x="1326" y="828">passages keep their</text><text class="bs" x="1326" y="844">citation provenance</text><rect x="56" y="962" width="1528" height="172" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="986">ASK — GROUNDED Q&amp;A (the order is load-bearing)</text><rect x="80" y="996" width="221" height="106" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="996" width="4" height="106" rx="2" fill="#be123c"/><text class="bt" x="96" y="1020">Grounding gate</text><text class="bs" x="96" y="1040">no passages ⇒ canned</text><text class="bs" x="96" y="1056">refusal and NO model</text><text class="bs" x="96" y="1072">call at all</text><rect x="327" y="996" width="221" height="106" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="327" y="996" width="4" height="106" rx="2" fill="#475569"/><text class="bt" x="343" y="1020">Reranker</text><text class="bs" x="343" y="1040">injected; pass-through</text><text class="bs" x="343" y="1056">by default</text><path class="edge" d="M301,1049 L327,1049" marker-end="url(#a)"/><rect x="574" y="996" width="221" height="106" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="574" y="996" width="4" height="106" rx="2" fill="#475569"/><text class="bt" x="590" y="1020">Token budget</text><text class="bs" x="590" y="1040">fit the context —</text><text class="bs" x="590" y="1056">always keeps ≥ 1</text><text class="bs" x="590" y="1072">passage</text><path class="edge" d="M548,1049 L574,1049" marker-end="url(#a)"/><rect x="821" y="996" width="221" height="106" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="821" y="996" width="4" height="106" rx="2" fill="#b45309"/><text class="bt" x="837" y="1020">Egress decision</text><text class="bs" x="837" y="1040">recomputed LIVE per</text><text class="bs" x="837" y="1056">record: 'restricted'</text><text class="bs" x="837" y="1072">forbids external gen.</text><path class="edge" d="M795,1049 L821,1049" marker-end="url(#a)"/><rect x="1068" y="996" width="221" height="106" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1068" y="996" width="4" height="106" rx="2" fill="#6d28d9"/><text class="bt" x="1084" y="1020">LlmProvider</text><text class="bs" x="1084" y="1040">generate — the answer</text><text class="bs" x="1084" y="1056">is returned RAW; the</text><text class="bs" x="1084" y="1072">client escapes it</text><path class="edge" d="M1042,1049 L1068,1049" marker-end="url(#a)"/><rect x="1315" y="996" width="221" height="106" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1315" y="996" width="4" height="106" rx="2" fill="#15803d"/><text class="bt" x="1331" y="1020">Answer + citations</text><text class="bs" x="1331" y="1040">citations are the record</text><text class="bs" x="1331" y="1056">locators behind each</text><text class="bs" x="1331" y="1072">passage used</text><path class="edge" d="M1289,1049 L1315,1049" marker-end="url(#a)"/><path class="edge" d="M308,196 L352,196" marker-end="url(#a)"/><path class="edge" d="M620,196 L664,196" marker-end="url(#a)"/><path class="edge" d="M916,196 L960,196" marker-end="url(#a)"/><path class="edge" d="M1208,196 L1252,196" marker-end="url(#a)"/><path class="edge" d="M1084,246 L1084,260 L230,260 L230,274" marker-end="url(#a)"/><path class="edge" d="M380,340 L418,340" marker-end="url(#a)"/><path class="edge" d="M668,340 L706,340" marker-end="url(#a)"/><path class="edge" d="M956,340 L994,340" marker-end="url(#a)"/><path class="edge" d="M1244,340 L1282,340" marker-end="url(#a)"/><path class="edge" d="M1409,406 L1409,506" marker-end="url(#a)"/><text class="elab" x="1409" y="450" text-anchor="middle">writes chunk rows</text><path class="edged" d="M1174,618 L1174,662 L543,662 L543,716" marker-end="url(#ad)"/><text class="elab" x="860" y="655" text-anchor="middle">dense + lexical read</text><path class="edge" d="M380,790 L418,762" marker-end="url(#a)"/><path class="edge" d="M380,838 L418,866" marker-end="url(#a)"/><path class="edge" d="M668,762 L706,794" marker-end="url(#a)"/><path class="edge" d="M668,866 L706,834" marker-end="url(#a)"/><path class="edge" d="M934,814 L972,814" marker-end="url(#a)"/><path class="edge" d="M1272,814 L1310,814" marker-end="url(#a)"/><path class="edge" d="M1423,860 L1423,946 L192,946 L192,996" marker-end="url(#a)"/><text class="elab" x="800" y="940" text-anchor="middle">the `ask` action continues:</text><text class="note" x="56" y="1152">Registered in the core API ACTION_REGISTRY as dd_rag_api (session + CSRF gated) · the whole subsystem is behind the DEDALO_RAG_ENABLED kill-switch · vectors are rebuildable, the matrix DB stays the source of truth</text>
</svg>
