<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1120" width="1640" height="1120" xml:space="preserve" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c9d0da"/>
</marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#5f6875"/>
</marker>
</defs>
<style>
  .ttl { font-size:30px; font-weight:700; fill:#171a21; }
  .sub { font-size:14.5px; fill:#5f6875; }
  .lane { font-size:11px; font-weight:700; letter-spacing:1.6px; fill:#5f6875; }
  .bt { font-size:14.5px; font-weight:650; fill:#171a21; }
  .bs { font-size:11.8px; fill:#5f6875; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:11.5px; fill:#5f6875; }
  .edge { fill:none; stroke:#c9d0da; stroke-width:1.8; }
  .edged { fill:none; stroke:#5f6875; stroke-width:1.6; stroke-dasharray:5 4; }
  .elab { font-size:10.8px; fill:#5f6875; }
  .note { font-size:12px; fill:#5f6875; }
</style>
<rect width="1640" height="1120" fill="#ffffff"/>
<text class="ttl" x="56" y="60">Dédalo v7 — Publication API v2</text>
<text class="sub" x="56" y="86">publication/server_api/v2 — a read-only REST + MCP surface over the MariaDB the diffusion process publishes</text>
<rect x="56" y="110" width="1528" height="210" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="134">REQUEST PIPELINE</text><rect x="80" y="146" width="300" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="146" width="4" height="150" rx="2" fill="#475569"/><text class="bt" x="96" y="170">consumers</text><text class="bs" x="96" y="190">public websites built by site_builder ·</text><text class="bs" x="96" y="206">harvesters · AI agents over MCP ·</text><text class="bs" x="96" y="222">any HTTP client. No account, no</text><text class="bs" x="96" y="238">session: the data is already public.</text><rect x="416" y="146" width="300" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="416" y="146" width="4" height="150" rx="2" fill="#475569"/><text class="bt" x="432" y="170">deployment</text><text class="bs" x="432" y="190">apache | nginx | standalone;</text><text class="bs" x="432" y="206">mounted at BASE_PATH, bound to</text><text class="bs" x="432" y="222">127.0.0.1:3100 behind the web</text><text class="bs" x="432" y="238">server that already serves the media</text><rect x="752" y="146" width="380" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="752" y="146" width="4" height="150" rx="2" fill="#be123c"/><text class="bt" x="768" y="170">routeRequest — the choke point</text><text class="bs" x="768" y="190">rate limiting (RATE_LIMIT_RPM) and API-key</text><text class="bs" x="768" y="206">auth run BEFORE routing. Then a hand-rolled</text><text class="bs" x="768" y="222">EXACT-ARITY segment matcher: no wildcard, no</text><text class="bs" x="768" y="238">optional segment, no regex — a matcher whose</text><text class="bs" x="768" y="254">security properties can be argued about.</text><rect x="1168" y="146" width="368" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1168" y="146" width="4" height="150" rx="2" fill="#475569"/><text class="bt" x="1184" y="170">middleware</text><text class="bs" x="1184" y="190">request-id · timeout · logger ·</text><text class="bs" x="1184" y="206">http-cache (ETag / 304) · compress ·</text><text class="bs" x="1184" y="222">CORS · RFC 9457 Problem Details</text><text class="bs" x="1184" y="238">errors · RFC 8288 Link pagination</text><rect x="56" y="350" width="1528" height="226" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="374">ROUTES — resource-oriented, every one of them a read</text><rect x="80" y="386" width="700" height="166" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="386" width="4" height="166" rx="2" fill="#2563eb"/><text class="bt" x="96" y="410">records and schema</text><text class="mono" xml:space="preserve" x="96" y="430">GET  /                              the api index</text><text class="mono" xml:space="preserve" x="96" y="446">GET  /databases                     configured public dbs</text><text class="mono" xml:space="preserve" x="96" y="462">GET  /:db/tables                    list tables</text><text class="mono" xml:space="preserve" x="96" y="478">GET  /:db/tables/:table             one table + its schema</text><text class="mono" xml:space="preserve" x="96" y="494">GET  /:db/tables/:table/records     paginated records</text><text class="mono" xml:space="preserve" x="96" y="510">GET  /:db/tables/:table/records/:id one record</text><rect x="812" y="386" width="724" height="166" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="812" y="386" width="4" height="166" rx="2" fill="#0f766e"/><text class="bt" x="828" y="410">search, fragments, tooling</text><text class="mono" xml:space="preserve" x="828" y="430">GET  /:db/…/records/:id/fragments     text passages</text><text class="mono" xml:space="preserve" x="828" y="446">GET  /:db/…/records/:id/av-fragments  timecoded passages</text><text class="mono" xml:space="preserve" x="828" y="462">GET  /:db/tables/:table/search        filter DSL + fulltext</text><text class="mono" xml:space="preserve" x="828" y="478">GET  /:db/av-indexation-fragment</text><text class="mono" xml:space="preserve" x="828" y="494">POST /batch                           many reads, one round trip</text><text class="mono" xml:space="preserve" x="828" y="510">POST /mcp                             9 stateless read tools</text><text class="mono" xml:space="preserve" x="828" y="526">GET  /docs · /docs/swagger · /docs/scalar · /openapi.yaml</text><rect x="56" y="590" width="1528" height="250" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="614">SERVICES AND DATA ACCESS</text><rect x="80" y="662" width="340" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="662" width="4" height="150" rx="2" fill="#be123c"/><text class="bt" x="96" y="686">schema.service</text><text class="bs" x="96" y="706">asserts that the table (and, where</text><text class="bs" x="96" y="722">one is interpolated, the column)</text><text class="bs" x="96" y="738">EXISTS before any SQL is composed.</text><text class="bs" x="96" y="754">That ordering IS the security story;</text><text class="bs" x="96" y="770">schema-cache keeps it cheap.</text><rect x="444" y="662" width="340" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="444" y="662" width="4" height="150" rx="2" fill="#2563eb"/><text class="bt" x="460" y="686">query-builder</text><text class="bs" x="460" y="706">parameterized `?` placeholders and</text><text class="bs" x="460" y="722">validated identifiers only; bounded</text><text class="bs" x="460" y="738">LIMIT, keyset pagination, and the</text><text class="bs" x="460" y="754">Link headers that page a client</text><text class="bs" x="460" y="770">through without an offset scan.</text><rect x="808" y="662" width="340" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="808" y="662" width="4" height="150" rx="2" fill="#0f766e"/><text class="bt" x="824" y="686">search.service</text><text class="bs" x="824" y="706">the DATABASE decides which records</text><text class="bs" x="824" y="722">match (FULLTEXT MATCH … AGAINST);</text><text class="bs" x="824" y="738">JavaScript cuts the &lt;mark&gt;ed excerpt.</text><text class="bs" x="824" y="754">Passages carry [page-n-N] references,</text><text class="bs" x="824" y="770">or a [tc-in-out] timecode window.</text><rect x="1172" y="662" width="364" height="150" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1172" y="662" width="4" height="150" rx="2" fill="#2563eb"/><text class="bt" x="1188" y="686">records · resolve · batch</text><text class="bs" x="1188" y="706">record reads, relation and inverse-</text><text class="bs" x="1188" y="722">relation resolution, and one batch</text><text class="bs" x="1188" y="738">service that fans several reads into</text><text class="bs" x="1188" y="754">a single round trip — the shape a</text><text class="bs" x="1188" y="770">static site generator actually wants.</text><rect x="56" y="880" width="1528" height="170" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="904">STORE AND ISOLATION</text><rect x="80" y="916" width="700" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="916" width="4" height="112" rx="2" fill="#b45309"/><text class="bt" x="96" y="940">MariaDB — the published database</text><text class="bs" x="96" y="960">written ONLY by the engine's diffusion runner, read here through Bun's native</text><text class="bs" x="96" y="976">`mariadb` adapter with a read-only user — no third-party client, unix socket or</text><text class="bs" x="96" y="992">TCP, and DB_NAMES is a hard allowlist every handler funnels :db through.</text><rect x="812" y="916" width="724" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="812" y="916" width="4" height="112" rx="2" fill="#be123c"/><text class="bt" x="828" y="940">THE ISOLATION LAW</text><text class="bs" x="828" y="960">It imports NO engine code, holds NO credential to the work database, and can run on a</text><text class="bs" x="828" y="976">different machine entirely — typically the web server's, next to the published data.</text><text class="bs" x="828" y="992">Every route is a read; there is no write path here to build one from.</text><path class="edge" d="M380,221 L416,221" marker-end="url(#a)"/><path class="edge" d="M716,221 L752,221" marker-end="url(#a)"/><path class="edge" d="M942,296 L942,326 L430,326 L430,386" marker-end="url(#a)"/><path class="edge" d="M430,552 L430,662" marker-end="url(#a)"/><text class="elab" x="447" y="612" text-anchor="start">handlers → services</text><path class="edge" d="M250,812 L250,916" marker-end="url(#a)"/><text class="elab" x="267" y="868" text-anchor="start">read-only user</text><text class="note" x="56" y="1092">TypeScript on Bun, OpenAPI 3.1 with offline Swagger UI + Scalar · standard HTTP semantics throughout (Problem Details, Link, ETag/304) · publication/server_api/v2/README.md</text>
</svg>
