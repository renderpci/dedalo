<rect width="1640" height="1060" fill="#ffffff"/>
<text class="ttl" x="56" y="60">Dédalo v7 — from the work system to the public web</text>
<text class="sub" x="56" y="86">Three planes: one engine writes, one runner publishes, one isolated API serves. They share data only through a database.</text>
<rect x="56" y="120" width="490" height="760" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="74" y="144">1 · THE WORK SYSTEM — /api/v1</text><rect x="576" y="120" width="490" height="760" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="594" y="144">2 · DIFFUSION — publishing</text><rect x="1096" y="120" width="488" height="760" rx="12" fill="#f5f7fa" stroke="#e4e8ee"/><text class="lane" x="1114" y="144">3 · PUBLICATION API v2 — read-only</text><rect x="80" y="166" width="442" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="166" width="4" height="100" rx="2" fill="#475569"/><text class="bt" x="96" y="190">client + server.ts</text><text class="bs" x="96" y="210">client/ (vanilla JS) posts an RQO to /api/v1</text><text class="bs" x="96" y="226">over a unix socket behind the reverse proxy</text><rect x="80" y="286" width="442" height="126" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="286" width="4" height="126" rx="2" fill="#be123c"/><text class="bt" x="96" y="310">dispatch.ts — five gates</text><text class="bs" x="96" y="330">allowlist → session → CSRF → idempotency →</text><text class="bs" x="96" y="346">an explicit RequestContext. Every refusal is a</text><text class="bs" x="96" y="362">thrown DedaloError; there is no dynamic lookup,</text><text class="bs" x="96" y="378">so an unregistered action does not exist.</text><rect x="80" y="432" width="442" height="126" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="432" width="4" height="126" rx="2" fill="#2563eb"/><text class="bt" x="96" y="456">handlers · read and write paths</text><text class="bs" x="96" y="476">read_facade → section/read.ts for reads;</text><text class="bs" x="96" y="492">saves go through save_component (transaction-</text><text class="bs" x="96" y="508">wrapped, Time Machine audited) into</text><text class="bs" x="96" y="524">matrix_write and the one JSONB codec.</text><rect x="80" y="578" width="442" height="110" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="578" width="4" height="110" rx="2" fill="#b45309"/><text class="bt" x="96" y="602">Postgres — the matrix database</text><text class="bs" x="96" y="622">dd_ontology defines everything; matrix_* holds</text><text class="bs" x="96" y="638">the records. This is the single source of truth,</text><text class="bs" x="96" y="654">and the only place a curator's edit lands.</text><rect x="80" y="708" width="442" height="110" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="80" y="708" width="4" height="110" rx="2" fill="#15803d"/><text class="bt" x="96" y="732">envelope v2</text><text class="bs" x="96" y="752">{ ok, request_id, data, notices, error } — one</text><text class="bs" x="96" y="768">converter builds every wire body, success or</text><text class="bs" x="96" y="784">failure, for the client and for every agent.</text><rect x="600" y="166" width="442" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="600" y="166" width="4" height="100" rx="2" fill="#2563eb"/><text class="bt" x="616" y="190">dd_diffusion_api</text><text class="bs" x="616" y="210">diffuse · get_process_status · list_processes ·</text><text class="bs" x="616" y="226">cancel_process · sweep_published_langs</text><rect x="600" y="286" width="442" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="600" y="286" width="4" height="100" rx="2" fill="#2563eb"/><text class="bt" x="616" y="310">the job row (Postgres)</text><text class="bs" x="616" y="330">the ONLY channel between the control and data</text><text class="bs" x="616" y="346">planes: heartbeat, progress, checkpoint, result</text><rect x="600" y="406" width="442" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="600" y="406" width="4" height="100" rx="2" fill="#0f766e"/><text class="bt" x="616" y="430">scheduler → runner process</text><text class="bs" x="616" y="450">one crash-isolated process per job, killable;</text><text class="bs" x="616" y="466">stale heartbeats are swept and re-queued</text><rect x="600" y="526" width="442" height="140" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="600" y="526" width="4" height="140" rx="2" fill="#6d28d9"/><text class="bt" x="616" y="550">the pipeline, checkpointed</text><text class="bs" x="616" y="570">compile the plan (ALL ontology interpretation</text><text class="bs" x="616" y="586">happens once, here) → selection → resolution</text><text class="bs" x="616" y="602">→ transform + language projection → writer</text><text class="bs" x="616" y="618">session. A committed checkpoint after every</text><text class="bs" x="616" y="634">batch is what makes kill -9 survivable.</text><rect x="600" y="686" width="442" height="132" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="600" y="686" width="4" height="132" rx="2" fill="#b45309"/><text class="bt" x="616" y="710">writers and targets</text><text class="bs" x="616" y="730">SQL → MariaDB · csv, json, xml, rdf, markdown</text><text class="bs" x="616" y="746">files on disk · mediastore .publication markers,</text><text class="bs" x="616" y="762">which the generated web-server rules read so a</text><text class="bs" x="616" y="778">32 GB file never enters the engine's byte path.</text><rect x="1120" y="166" width="442" height="124" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1120" y="166" width="4" height="124" rx="2" fill="#b45309"/><text class="bt" x="1136" y="190">MariaDB — the published database</text><text class="bs" x="1136" y="210">written ONLY by the diffusion runner, read ONLY</text><text class="bs" x="1136" y="226">by the publication API. The two planes never</text><text class="bs" x="1136" y="242">share a connection, a credential, or a line of</text><text class="bs" x="1136" y="258">code — only this database.</text><rect x="1120" y="310" width="442" height="110" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1120" y="310" width="4" height="110" rx="2" fill="#be123c"/><text class="bt" x="1136" y="334">routeRequest</text><text class="bs" x="1136" y="354">rate limiting and API-key auth run BEFORE</text><text class="bs" x="1136" y="370">routing; then an exact-arity segment matcher</text><text class="bs" x="1136" y="386">with no wildcard, no regex, no optional segment.</text><rect x="1120" y="440" width="442" height="126" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1120" y="440" width="4" height="126" rx="2" fill="#0f766e"/><text class="bt" x="1136" y="464">read-only REST</text><text class="bs" x="1136" y="484">/:db/tables/:table/records/:id, search over the</text><text class="bs" x="1136" y="500">FULLTEXT index, text and timecoded AV fragments,</text><text class="bs" x="1136" y="516">/batch for one round trip, OpenAPI 3.1 with</text><text class="bs" x="1136" y="532">offline Swagger UI and Scalar.</text><rect x="1120" y="586" width="442" height="100" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1120" y="586" width="4" height="100" rx="2" fill="#6d28d9"/><text class="bt" x="1136" y="610">MCP endpoint</text><text class="bs" x="1136" y="630">9 stateless read tools over the published data —</text><text class="bs" x="1136" y="646">a fresh server and transport per request</text><rect x="1120" y="706" width="442" height="112" rx="9" fill="#ffffff" stroke="#c9d0da"/><rect x="1120" y="706" width="4" height="112" rx="2" fill="#475569"/><text class="bt" x="1136" y="730">consumers</text><text class="bs" x="1136" y="750">the websites site_builder generates · harvesters ·</text><text class="bs" x="1136" y="766">AI agents · any HTTP client. No account and no</text><text class="bs" x="1136" y="782">session: this data is already public.</text><rect x="56" y="906" width="1528" height="88" rx="9" fill="#f5f7fa" stroke="#c9d0da"/><rect x="56" y="906" width="4" height="88" rx="2" fill="#15803d"/><text class="bt" x="72" y="930">THE SEAMS — why this shape</text><text class="bs" x="72" y="950">The work system never reads the published database. The runner never talks to the API server. The publication API imports no engine code and holds no credential to Postgres.</text><text class="bs" x="72" y="966">Data crosses each boundary exactly once, in one direction, through a database — which is what lets a museum put the public API on the web server and keep the work system inside the institution.</text><path class="edge" d="M301,266 L301,286" marker-end="url(#a)"/><path class="edge" d="M301,412 L301,432" marker-end="url(#a)"/><path class="edge" d="M301,558 L301,578" marker-end="url(#a)"/><path class="edge" d="M301,688 L301,708" marker-end="url(#a)"/><path class="edge" d="M821,266 L821,286" marker-end="url(#a)"/><path class="edge" d="M821,386 L821,406" marker-end="url(#a)"/><path class="edge" d="M821,506 L821,526" marker-end="url(#a)"/><path class="edge" d="M821,666 L821,686" marker-end="url(#a)"/><path class="edge" d="M1341,290 L1341,310" marker-end="url(#a)"/><path class="edge" d="M1341,420 L1341,440" marker-end="url(#a)"/><path class="edge" d="M1341,566 L1341,586" marker-end="url(#a)"/><path class="edge" d="M1341,686 L1341,706" marker-end="url(#a)"/><path class="edge" d="M522,495 L549,495 L549,216 L600,216" marker-end="url(#a)"/><text class="elab" x="549" y="340" text-anchor="middle">enqueue</text><path class="edge" d="M1042,752 L1069,752 L1069,228 L1120,228" marker-end="url(#a)"/><text class="elab" x="1069" y="470" text-anchor="middle">publish</text><text class="note" x="56" y="1032">src/core/api · src/diffusion · publication/server_api/v2 — specs: engineering/REWRITE_SPEC.md, engineering/DIFFUSION_SPEC.md</text>
</svg>
