# GitLab Secret Detection ruleset — makes the GitLab scan read the repo's own
# `.gitleaks.toml` (GitLab's analyzer IS gitleaks), so the allowlist is triaged in ONE
# place instead of drifting per platform. See `.gitlab-ci.yml` and `.github/workflows/security.yml`.
#
# `type = "file"` + `target = "gitleaks.toml"` is GitLab's documented passthrough for
# replacing the analyzer's config wholesale. Wholesale is why `.gitleaks.toml` sets
# `[extend] useDefault = true`: without that line, this passthrough would silently
# replace ~170 upstream provider rules with our two allowlists and report a clean repo
# because it stopped looking.
#
# VERIFY ON FIRST RUN: this is the one piece of this change that could not be exercised
# locally (it needs a GitLab pipeline). The check is that the `secret_detection` job log
# names the ruleset override — if it does not, the job is still scanning with defaults,
# which is SAFE (it scans more, and the two doc/vendor false positives come back), not
# silently blind. Fix it then; do not disable the job.
[secrets]
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = ".gitleaks.toml"
