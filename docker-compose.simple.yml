# Dédalo v7 — SIMPLE stack: a complete, ready-to-use instance in one command.
#
# Operator guide: docs/install/quickstart.md
#
#   Path 1 — guided install (it asks you the questions):
#       ./install.sh
#
#   Path 2 — browser wizard (it asks you nothing here):
#       docker compose -f docker-compose.simple.yml up -d
#       …then open http://localhost/dedalo/core/page/ and fill the wizard.
#
# WHAT THIS TRADES AWAY, on purpose, to fit in one command:
#   * no TLS — plain HTTP, so SESSION_COOKIE_SECURE must be false (a browser
#     silently discards a Secure cookie over http://, and nobody could log in);
#   * no media access control — every media file is readable by anyone who can
#     reach the server, logged in or not (deploy/nginx.simple.conf serves the
#     media tree openly, with no per-record and no per-project checks).
#
# Both are fine on a machine only your institution's network can reach. Neither
# is acceptable on the public internet — for that, use docker-compose.yml and
# docs/install/docker.md, which add TLS and the engine-enforced media gate.
#
# GROWING OUT OF IT: the volume names here are the same as docker-compose.yml's,
# so moving to the full stack is additive (add TLS, set DEDALO_MEDIA_ACCESS_MODE,
# swap the nginx config) — never a reinstall. The data never moves.

name: dedalo

services:
  # --- PostgreSQL: the system of record --------------------------------------
  # Creates an EMPTY database owned by the role, which is exactly the installer's
  # precondition (it restores INTO a database, refuses a non-empty one, and never
  # creates one itself).
  #
  # The defaults below are intentionally boring: this port is NOT published, so
  # the database is reachable only from the other containers on this network.
  # Path 2 users type these same values into the wizard's database step.
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dedalo}
      POSTGRES_USER: ${POSTGRES_USER:-dedalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dedalo}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. From 18 the official
      # image stores data in a major-version subdirectory (PGDATA is
      # /var/lib/postgresql/18/docker) so that pg_upgrade --link works across a
      # single mount point. A volume on the old .../data path is detected as an
      # "unused mount/volume" and the container REFUSES TO START.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dedalo} -d ${POSTGRES_DB:-dedalo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- The engine ------------------------------------------------------------
  dedalo:
    build: .
    # The container equivalent of systemd's Restart=always — and what makes the
    # wizard's "Save config" step work at all: the process exits after writing
    # .env so that it can be restarted into the real configuration.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DELIBERATELY ABSENT: ENTITY, DB_NAME, DB_HOST, DB_USER. Those four keys
      # are the engine's "is this a fresh box?" test (src/config/install_mode.ts).
      # Setting any of them here would take the engine OUT of install mode and
      # the browser wizard would never appear — so the install answers reach the
      # engine as installer arguments (path 1) or as wizard input (path 2), never
      # as container environment.
      DEDALO_PRIVATE_DIR: /private
      SERVER_UNIX_SOCKET: /run/dedalo/dedalo_ts.sock
      MEDIA_PATH: /srv/dedalo/media
      # MEDIA IS SERVED OPENLY HERE, and since 2026-08-24 that is a property of
      # THIS STACK'S NGINX, not of the engine's mode. deploy/nginx.simple.conf
      # does not `include` the generated rule files, so nothing enforces a gate
      # no matter what mode the engine resolves — and the engine's default is now
      # fail-closed `publication`, so it WILL write those files and they WILL be
      # ignored here. Say it rather than imply it: an operator who needs
      # per-record media access control wants the full stack
      # (docker-compose.yml), whose nginx includes both files.
      #
      # TRUE whenever there is TLS — which install.sh makes the default. It is
      # flipped to "false" only by the no-HTTPS mode, because a browser silently
      # discards a Secure cookie over http:// and every login would appear to
      # succeed and then do nothing.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DEDALO_ACCESS_LOG: "true"
      TRUSTED_PROXY_HOPS: "1"
      DEDALO_DEV_MODE: "false"
      DEDALO_DEBUG_API_ERRORS: "false"
      # WHO MAY REACH THE INSTALL WIZARD. Until the wizard SEALS the instance its
      # actions are pre-auth — they write /private/.env and restart the engine —
      # so since 2026-08-24 an unset value means LOOPBACK ONLY. In a container
      # that is exactly nobody: nginx forwards your browser's real address
      # (TRUSTED_PROXY_HOPS above), which is never this namespace's loopback. A
      # browser install through this stack therefore REQUIRES naming the address
      # you browse from:
      #   export DEDALO_INSTALL_ALLOWED_IPS=203.0.113.10   # or 10.0.0.0/24, or `any`
      # Drop the value once the instance is sealed.
      DEDALO_INSTALL_ALLOWED_IPS: ${DEDALO_INSTALL_ALLOWED_IPS:-}
      # The engine never serves media here — nginx does, from the shared volume.
      MEDIA_DEV_ROUTE_ENABLED: "false"
    volumes:
      - private:/private          # .env, sessions, ts_state.json, backups — SECRETS
      - media:/srv/dedalo/media   # written by the engine, READ by the proxy
      - socket:/run/dedalo        # the unix socket, shared with the proxy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--unix-socket", "/run/dedalo/dedalo_ts.sock", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- The reverse proxy -----------------------------------------------------
  # Owns TCP, serves the client statics, and serves the media tree OPENLY. It
  # `include`s no generated rule files, so unlike the full stack it starts
  # immediately and needs no post-install wiring step.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - dedalo
    ports:
      # 443 is published in every TLS mode; 80 stays published because it both
      # redirects to HTTPS and answers the ACME challenge at renewal time.
      # Bind to one interface (e.g. "127.0.0.1:443:443") if this machine has an
      # address you do not want it answering on.
      - "80:80"
      - "443:443"
    volumes:
      # install.sh writes deploy/nginx.simple.generated.conf from the TLS
      # template and points this variable at it. The default keeps a bare
      # `docker compose -f docker-compose.simple.yml up -d` working exactly as
      # before — plain HTTP, no certificate needed.
      - ./deploy/${DEDALO_NGINX_CONF:-nginx.simple.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./client:/opt/dedalo/master_dedalo/client:ro
      - media:/srv/dedalo/media:ro
      - socket:/run/dedalo
      # Let's Encrypt material, shared with the certbot service.
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      # Local-CA and bring-your-own certificates. Not a volume: you may want to
      # replace these files by hand.
      - ./deploy/certs:/etc/dedalo/certs:ro
    # Renewed certificates only take effect on a reload, and certbot cannot
    # signal another container. Reloading every 6h is the standard answer: it
    # costs nothing and picks up a renewal within hours of it landing.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # --- Let's Encrypt renewal (profile `letsencrypt`) -------------------------
  # The FIRST certificate is obtained by install.sh with a one-off standalone
  # certbot run, before nginx exists to hold port 80. This service only RENEWS,
  # over the webroot the nginx config exposes at /.well-known/acme-challenge/ —
  # so renewal never needs to stop the proxy. install.sh enables the profile.
  certbot:
    image: certbot/certbot
    profiles: ["letsencrypt"]
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # --- Nightly backup --------------------------------------------------------
  # THE STACK HAD NO BACKUP JOB AT ALL (P0-13, 2026-08-30). deploy/dedalo-backup.*
  # is a systemd unit, which a compose host does not run — so every containerised
  # install shipped with no scheduled copy of anything, while `private:` and
  # `media:` carried the comment "back this up" and nothing did.
  #
  # It runs the SAME scripts the systemd unit runs (bind-mounted: deploy/ is
  # deliberately absent from the image, see the Dockerfile's build-context
  # allowlist), so there is one implementation of "what a backup is" and not two.
  #
  # THREE OF THE FIVE STORES OF engineering/PRODUCTION.md §6 EXIST HERE: the matrix
  # DB (1), the media originals (3) and /private (4). Store 2 (RAG) lives in the
  # `rag` profile — add a fourth step for it, like the unit's commented line, if you
  # enable it; store 5 (site-builder instances) is not part of this stack.
  #
  # WHERE IT WRITES, AND WHAT THAT IS WORTH. Into the `backups` volume — i.e. onto
  # this same host, next to the data. That is a real restore point for the failures
  # that actually happen most (a bad import, a deleted record, a truncated dump) and
  # NO PROTECTION AT ALL against losing the machine or the disk. Copy the volume off
  # this host on a schedule you control; nothing in a single-host compose file can
  # do that for you, and a backup that never leaves the machine it protects is half
  # a backup.
  #
  # HOW YOU KNOW IT WORKED: `docker compose ps` marks this service UNHEALTHY while
  # /backups/BACKUP_FAILED exists — the marker the run writes when any store fails
  # and removes when every store succeeds. That file, and /backups/LAST_OK, are the
  # two things to look at.
  backup:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The database this stack created. If you told the install wizard a DIFFERENT
      # database or role than these, correct them here — the backup connects on its
      # own and cannot ask the engine what it chose.
      DB_NAME: ${POSTGRES_DB:-dedalo}
      DB_USER: ${POSTGRES_USER:-dedalo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dedalo}
      DB_HOST: postgres
      # Same media root the engine and the proxy use, mounted read-only below.
      MEDIA_PATH: /srv/dedalo/media
      DEDALO_BACKUP_STATE_DIR: /backups
      # How many dated generations of the media originals and of /private to keep.
      # A one-generation mirror propagates a mass deletion within a day; these are
      # hard-linked, so a fortnight of them costs about one copy plus the changes.
      DEDALO_BACKUP_KEEP: "14"
    volumes:
      - ./deploy:/opt/dedalo/master_dedalo/deploy:ro
      - private:/private:ro
      - media:/srv/dedalo/media:ro
      - backups:/backups
    # One run a day, the first one an hour after start. `sleep & wait` (not a bare
    # sleep) is the same shape as the nginx/certbot loops above: it lets SIGTERM
    # stop the container promptly instead of waiting out the sleep.
    entrypoint:
      - /bin/sh
      - -c
      - |
        # NO `set -e`: a store that fails must not stop the next one, nor kill the
        # loop. The run's verdict is /backups/BACKUP_FAILED (written by the last
        # step, removed when every store succeeded) and the healthcheck reads it.
        set -u
        D=/opt/dedalo/master_dedalo/deploy
        export DEDALO_BACKUP_STATUS_DIR=/tmp/dedalo-backup-status
        sleep 3600 & wait $${!}
        while :; do
          rm -rf "$$DEDALO_BACKUP_STATUS_DIR"
          "$$D/dedalo-backup-step.sh" run matrix_db \
            "$$D/dedalo-db-backup.sh" --label compose --dir /backups/db \
            --db-key DB_NAME --host-key DB_HOST --port-key DB_PORT \
            --user-key DB_USER --password-key DB_PASSWORD \
            --pg-dump pg_dump --pg-restore pg_restore
          "$$D/dedalo-backup-step.sh" run media \
            "$$D/dedalo-tree-backup.sh" --label media --source-key MEDIA_PATH \
            --dest /backups/media --keep "$$DEDALO_BACKUP_KEEP"
          "$$D/dedalo-backup-step.sh" run --last private \
            "$$D/dedalo-tree-backup.sh" --label private --source /private/ \
            --dest /backups/private --keep "$$DEDALO_BACKUP_KEEP"
          sleep 86400 & wait $${!}
        done
    healthcheck:
      # UNHEALTHY while the last run left a failure marker. This is the whole
      # notification mechanism a compose host gets: there is no systemd OnFailure=
      # here, so the state has to be visible in `docker compose ps`.
      test: ["CMD-SHELL", "test ! -e /backups/BACKUP_FAILED"]
      interval: 300s
      timeout: 5s
      retries: 1
      start_period: 60s

volumes:
  pgdata:
  private:      # SECRETS — back this up
  media:        # the originals are the source of truth — back this up
  socket:
  backups:      # the nightly copies — SEE THE backup SERVICE: copy this OFF this host
  letsencrypt:  # issued certificates + the ACME account key
  certbot_www:  # the challenge webroot, shared with nginx
