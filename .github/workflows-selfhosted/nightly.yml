# Nightly full-fat run — everything the repo can gate on this machine:
# the whole bun test tree (unit + parity + integration/MariaDB) plus the
# browser client gate (puppeteer against a CI-scoped server on :3510).
#
# GitHub caveats (docs/CI.md): schedules run only on the default branch, and
# GitHub pauses them after ~60 days of repo inactivity — re-enable from the
# Actions tab. Cron is UTC (01:00 UTC ≈ 03:00 Europe/Madrid).
#
# Invariants in this file are enforced by test/unit/ci_workflow_tripwire.test.ts.
name: nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: without this block a workflow inherits the
# REPOSITORY default, which on an older repo is read/WRITE on contents, packages,
# issues and pull-requests — ambient push rights handed to every step, including a
# third-party action. None of these jobs writes anything back to the repo.
# Enforced by rule 7 of test/unit/ci_workflow_tripwire.test.ts.
permissions:
  contents: read

concurrency:
  group: nightly-selfhosted
  cancel-in-progress: false

jobs:
  full-and-client:
    runs-on: [self-hosted, macOS, dedalo-mac]
    timeout-minutes: 90
    env:
      ORACLE_REQUIRED: "1"
      DIFFUSION_JOBS_TABLE: dedalo_ts_test_ci_diffusion_jobs
      DIFFUSION_ACTIVITY_TABLE: dedalo_ts_test_ci_activity_diffusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Link sibling paths (../private, PHP tree, client lib)
        run: bash scripts/ci/link_siblings.sh
      - name: Runner preconditions (bun pin, env, service probes)
        run: bash scripts/ci/env_guard.sh
      - name: Install
        run: bun install --frozen-lockfile
      # --timeout=30000 is a LITERAL COPY of TEST_TIMEOUT_MS in scripts/lib/test_flags.ts,
      # which is the source of truth; a workflow file cannot import it, and a `bun -e`
      # readback would add a bun subprocess to every CI tier for a copy that would still
      # exist. A tripwire gate keeps this literal in step with the constant. It is on the
      # command line and not in bunfig.toml because Bun 1.4.0 SILENTLY IGNORES
      # `[test] timeout` — the nightly's recorded baseline was cut under a 5000 ms cap
      # nobody chose.
      - name: Full suite (unit + parity + integration)
        shell: bash
        run: bun test --timeout=30000 2>&1 | tee nightly-suite.log
      - name: Client gate (browser suite vs CI server on :3510)
        shell: bash
        run: bash scripts/ci/client_gate.sh 2>&1 | tee client-gate.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-logs
          path: |
            nightly-suite.log
            client-gate.log
