# PR gate — HERMETIC TIER ONLY (engineering/CI.md).
#
# PUBLIC-REPO POSTURE (2026-07-11): renderpci/dedalo is PUBLIC, so NO job in this
# directory may target the self-hosted runner. A fork PR runs attacker-controlled
# code, and the self-hosted Mac holds the real ../private/.env and the live matrix
# Postgres — a self-hosted PR job there is remote code execution on the data host.
# The DB/parity/client tier lives in .github/workflows-selfhosted/ (inert here; GitHub
# only executes .github/workflows/) and runs ONLY on the private mirror.
# Do NOT move a self-hosted job back into this directory.
#
# hermetic — GitHub-hosted; typecheck + lint + DB-less tripwires via the shared
#            scripts/ci/hermetic.sh (the same script .gitlab-ci.yml runs, so the two
#            platforms cannot drift). No secrets, no DB, no oracle.
#
# Invariants in this file are enforced by test/unit/ci_workflow_tripwire.test.ts.
name: ci

# TRIGGERS — a tier that does not run on the branch work lands on is a tier that
# reports NOTHING. Until 2026-08-29 this workflow triggered on `pull_request`
# alone, while development happens directly on `v7` and only reaches master at a
# merge, so every push to `v7` ran zero gates: the hermetic tier executed only if
# someone happened to open a PR. The branch list must name every branch work
# actually lands ON, not only the ones it is merged INTO. (P0-1 of the
# 2026-08-26 deep audit.)
#
# WHAT THIS DOES NOT FIX, stated so the comment is not read as more than it is:
# `scripts/verify.ts` — the command that sat RED for 45 commits — is still run by
# NO executing workflow. It appears only in .github/workflows-selfhosted/, a
# directory GitHub does not read, so the self-hosted tier is inert until it is
# registered. Making the hermetic tier fire on `v7` is a precondition for that
# signal, not a substitute for it.
on:
  pull_request:
  push:
    branches: [master, v7]

# Least privilege for GITHUB_TOKEN: without this block a workflow inherits the
# REPOSITORY default, which on an older repo is read/WRITE on contents, packages,
# issues and pull-requests — ambient push rights handed to every step, including a
# third-party action. None of these jobs writes anything back to the repo.
# Enforced by rule 7 of test/unit/ci_workflow_tripwire.test.ts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version # the load-bearing pin — never inline a version
      - name: Hermetic tier (install + tsc + biome + static tripwires)
        run: bash scripts/ci/hermetic.sh
