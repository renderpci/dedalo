<VirtualHost *:80>
    ServerName museum.org
    ServerAlias www.museum.org
    DocumentRoot /home/museum.org/httpdocs
RewriteEngine on
RewriteCond %{SERVER_NAME} =museum.org [OR]
RewriteCond %{SERVER_NAME} =www.museum.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
