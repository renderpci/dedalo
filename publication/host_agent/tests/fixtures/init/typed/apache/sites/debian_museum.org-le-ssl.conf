<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName museum.org
    ServerAlias www.museum.org
    DocumentRoot /home/museum.org/httpdocs
    ErrorLog /home/museum.org/logs/error.log
    CustomLog /home/museum.org/logs/access.log combined
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm-museum.org.sock|fcgi://localhost"
    </FilesMatch>
SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
</VirtualHost>
</IfModule>
