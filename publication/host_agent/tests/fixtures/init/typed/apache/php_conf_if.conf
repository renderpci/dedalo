# The FORM THE SPEC ASSUMED for EL php.conf (handler inside <If>). No captured EL host ships it
# (captured/rocky9, rocky9_php82: a plain <FilesMatch> inside <IfModule !mod_php…>);
# kept to hold parsePhpConf's insideIf branch.
<IfModule !mod_php.c>
  <FilesMatch \.(php|phar)$>
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </If>
  </FilesMatch>
</IfModule>
