<!-- HTML for static distribution bundle build.
     swagger-ui-dist 5.32.14, trimmed: ./swagger-ui/ holds the two bundles, the
     stylesheet, the favicons and the licence texts — see vendor/vendor_manifest.json
     row "swagger-ui" (digest-pinned, advisory-watched) and engineering/VENDORING.md. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui/swagger-ui.css" />
    <link rel="icon" type="image/png" href="./swagger-ui/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./swagger-ui/favicon-16x16.png" sizes="16x16" />
    <style>
      html
      {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }

      *,
      *:before,
      *:after
      {
        box-sizing: inherit;
      }

      body
      {
        margin:0;
        background: #fafafa;
      }
      /* CUSTOM */
      .swagger-ui .parameters-col_description input[type=text], input {
        max-width: 100% !important;
      }
      .topbar {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui/swagger-ui-bundle.js" charset="UTF-8"> </script>
    <script src="./swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"> </script>
    <script>
      function getQueryVariable(variable) {
         var query = window.location.search.substring(1);
         var vars = query.split("&");
         for (var i=0;i<vars.length;i++) {
                 var pair = vars[i].split("=");
                 if(pair[0] == variable){return pair[1];}
         }
         return(false);
      }

      function updateQueryStringParameter(uri, key, value) {
        var re = new RegExp("([?&])" + key + "=.*?(&|$)", "i");
        var separator = uri.indexOf('?') !== -1 ? "&" : "?";
        if (uri.match(re)) {
          return uri.replace(re, '$1' + key + "=" + value + '$2');
        }
        else {
          return uri + separator + key + "=" + value;
        }
      }

    window.onload = function() {

      let url = window.location.origin + window.location.pathname + "json/json.php" + window.location.search
      if (!getQueryVariable("host")) {
        url = updateQueryStringParameter(url, 'host', window.location.host)
      }
      if (!getQueryVariable("code")) {
        url = updateQueryStringParameter(url, 'code', 'XXXX')
      }
      if (!getQueryVariable("lang")) {
        url = updateQueryStringParameter(url, 'lang', 'lg-spa')
      }

      // Begin Swagger UI call region
      const ui = SwaggerUIBundle({
        url: url,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
      // End Swagger UI call region

      window.ui = ui;
    };
  </script>
  </body>
</html>
